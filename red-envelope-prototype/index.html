<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>红包管理重构</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "#f5f6fa",
            panel: "#ffffff",
            line: "#e6eaf2",
            primary: "#2f6bff",
            text: "#1f2430",
            muted: "#97a0b3",
            success: "#3abf74",
            warn: "#f6ad55",
            danger: "#ef5b5b"
          },
          boxShadow: {
            panel: "0 10px 26px rgba(15,23,42,0.08)",
            pop: "0 18px 42px rgba(15,23,42,0.18)"
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --anim-fast: 140ms;
      --anim-normal: 220ms;
      --focus: 0 0 0 3px rgba(47,107,255,0.2);
      --radius: 8px;
      --filter-w-xs: 96px;
      --filter-w-sm: 112px;
      --filter-w-md: 140px;
      --filter-w-lg: 180px;
      --filter-w-xl: 220px;
      --filter-w-range: 300px;
      --field-text: #1f2937;
      --field-placeholder: #9aa5b5;
      --field-default-text: #64748b;
    }
    body { background: #f5f6fa; color: #1f2430; }
    .main-tab { font-size: 14px; font-weight: 500; color: #334155; }
    .main-tab[aria-selected="true"] { color: #2563eb; border-bottom-color: #2563eb; font-weight: 600; }
    .main-tab[aria-selected="false"] { color: #334155; border-bottom-color: transparent; font-weight: 500; }
    .badge { font-size: 11px; border-radius: 9999px; padding: 2px 8px; font-weight: 700; display: inline-block; }
    .badge-ok { background: #dcfce7; color: #166534; }
    .badge-warn { background: #ffedd5; color: #c2410c; }
    .badge-danger { background: #fee2e2; color: #b91c1c; }
    .badge-neutral { background: #eef2f7; color: #64748b; }
    .btn-disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
    .cell-ellipsis { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .modal-mask { transition: opacity var(--anim-normal) ease; }
    .modal-panel { transform: translateY(14px) scale(.98); opacity: 0; transition: transform var(--anim-normal) ease, opacity var(--anim-normal) ease; }
    .modal-open .modal-mask { opacity: 1; pointer-events: auto; }
    .modal-open .modal-panel { transform: translateY(0) scale(1); opacity: 1; }
    .modal-close-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 22px;
      line-height: 1;
      border-radius: 6px;
      cursor: pointer;
    }
    .modal-close-btn:hover { color: #334155; background: #f1f5f9; }
    .skeleton {
      background: linear-gradient(90deg,#edf2f7 25%,#f8fafc 37%,#edf2f7 63%);
      background-size: 400% 100%;
      animation: shimmer 1.2s ease infinite;
    }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    input:focus, select:focus, textarea:focus, button:focus { outline: none; box-shadow: var(--focus); }
    .coupon-filter-card {
      border: 1px solid #dfe5f0;
      border-radius: 10px;
      background: linear-gradient(180deg, #fbfdff 0%, #f8fbff 100%);
      box-shadow: inset 0 1px 0 #ffffff;
    }
    .coupon-input {
      width: 100%;
      min-width: 0;
      height: 36px;
      border: 1px solid #d5ddeb;
      border-radius: 7px;
      padding: 0 10px;
      background: #fff;
      color: var(--field-text);
      font-size: 14px;
      font-weight: 400;
      box-sizing: border-box;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .coupon-input::placeholder { color: var(--field-placeholder); }
    .coupon-input:hover { border-color: #c4d0e6; }
    select.coupon-input:required:invalid,
    select.coupon-input.option-empty { color: var(--field-default-text); }
    select.coupon-input:has(option[value=""]:checked) { color: var(--field-default-text); }
    .coupon-filter-card .grid.grid-cols-6 {
      align-items: center;
    }
    .coupon-filter-card .grid.grid-cols-6 > .coupon-input,
    .coupon-filter-card .grid.grid-cols-6 > .range-wrap {
      width: 100%;
      min-width: 0;
    }
    .coupon-tool-btn {
      height: 30px;
      padding: 0 14px;
      border-radius: 7px;
      border: 1px solid #2f6bff;
      background: #2f6bff;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(47,107,255,0.24);
      transition: transform .12s ease, background .12s ease;
    }
    .coupon-tool-btn:hover { background: #245cf0; }
    .coupon-tool-btn:active { transform: translateY(1px); }
    .coupon-table-wrap,
    .table-scroll-wrap {
      max-width: 100%;
      overflow-x: auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .coupon-table-wrap {
      border: 1px solid #dfe5f0;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(15,23,42,0.05);
    }
    #tablePanel { min-width: 0; max-width: 100%; }
    .coupon-table-wrap > table.data-table,
    .coupon-table-wrap > table.data-table.table-wide,
    .coupon-table-wrap > table.data-table.table-fill,
    .table-scroll-wrap > table.data-table,
    .table-scroll-wrap > table.data-table.table-fill {
      width: max-content;
      min-width: 100%;
      table-layout: auto;
      border-collapse: collapse;
    }
    .coupon-table-wrap > table.data-table th,
    .table-scroll-wrap > table.data-table th {
      min-width: 72px;
    }
    .coupon-table-wrap > table.data-table th.col-ops,
    .table-scroll-wrap > table.data-table th.col-ops {
      min-width: 120px;
    }
    .coupon-table-wrap > table.data-table th.col-compact,
    .coupon-table-wrap > table.data-table td.col-compact {
      padding-left: 8px;
      padding-right: 8px;
    }
    .coupon-table-wrap > table.data-table th.col-time,
    .coupon-table-wrap > table.data-table td.col-time {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .coupon-table-wrap > table.data-table th.col-opinion,
    .coupon-table-wrap > table.data-table td.col-opinion {
      white-space: normal;
      overflow: hidden;
    }
    .coupon-table-wrap > table.data-table td.col-opinion .cell-wrap {
      white-space: normal;
      word-break: break-word;
    }
    .coupon-table-wrap > table.data-table th,
    .coupon-table-wrap > table.data-table td {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 12px;
      padding-right: 12px;
      vertical-align: middle;
    }
    .coupon-table-wrap > table.data-table th.col-ops,
    .coupon-table-wrap > table.data-table td.col-ops {
      overflow: visible;
      text-overflow: clip;
      white-space: nowrap;
    }
    .coupon-table-wrap > table.data-table .cell-wrap {
      white-space: normal;
      word-break: break-word;
      line-height: 1.4;
    }
    .table-ops {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    .coupon-head { background: #f5f8fe; color: #5b6577; }
    .col-config-wrap { position: relative; display: inline-flex; }
    .col-config-panel {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 40;
      width: 260px;
      max-height: 360px;
      overflow: auto;
      border: 1px solid #d5ddeb;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(15,23,42,0.14);
      padding: 10px 12px;
    }
    .col-config-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 2px;
      font-size: 12px;
      color: #334155;
    }
    .col-config-panel label.fixed-col { color: #94a3b8; }
    .sticky-col {
      position: sticky;
      background: #fff;
      z-index: 2;
    }
    thead .sticky-col { background: #f5f8fe; z-index: 3; }
    .coupon-switch {
      position: relative;
      width: 42px;
      height: 22px;
      border-radius: 9999px;
      border: 1px solid rgba(15,23,42,0.08);
      transition: all .16s ease;
    }
    .coupon-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15,23,42,.2);
      transition: left .16s ease;
    }
    .coupon-switch.on { background: #33c26b; }
    .coupon-switch.on::after { left: 22px; }
    .coupon-switch.off { background: #d5dbe8; }
    .coupon-op-btn {
      min-width: 42px;
      height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      background: #2f6bff;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 3px 8px rgba(47,107,255,0.25);
      transition: transform .12s ease, background .12s ease;
    }
    .coupon-op-btn:hover { background: #245cf0; }
    .coupon-op-btn:active { transform: translateY(1px); }
    .query-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .query-actions { margin-left: auto; display: flex; gap: 8px; }
    .query-input { height: 36px; min-width: 180px; border: 1px solid #d5ddeb; border-radius: 6px; padding: 0 12px; background: #fff; flex: 0 0 auto; color: var(--field-text); font-size: 14px; font-weight: 400; }
    .query-input::placeholder { color: var(--field-placeholder); }
    .range-wrap { display: flex; align-items: center; height: 36px; border: 1px solid #d5ddeb; border-radius: 6px; background: #fff; padding: 0 10px; gap: 8px; min-width: 280px; flex: 0 0 auto; }
    .range-wrap input { width: 90px; border: none; outline: none; background: transparent; font-size: 14px; font-weight: 400; color: var(--field-text); }
    .range-wrap input::placeholder { color: var(--field-placeholder); }
    .range-wrap.grid-range { width: 100%; min-width: 0; flex: 1 1 auto; }
    .range-wrap.grid-range input { width: 0; min-width: 0; flex: 1 1 0; }
    .range-mid { color: #9aa5b6; font-weight: 600; }
    .query-w-90 { width: var(--filter-w-xs); min-width: var(--filter-w-xs); }
    .query-w-110 { width: var(--filter-w-sm); min-width: var(--filter-w-sm); }
    .query-w-128 { width: 128px; min-width: 128px; }
    .query-w-150 { width: 160px; min-width: 160px; }
    .query-w-180 { width: var(--filter-w-lg); min-width: var(--filter-w-lg); }
    .query-w-280 { width: var(--filter-w-range); min-width: var(--filter-w-range); }
    .search-grid {
      display: grid;
      grid-template-columns: 96px 180px 180px 160px 128px 280px auto;
      column-gap: 10px;
      row-gap: 10px;
      align-items: center;
    }
    .search-actions { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
    .filter-more { display: contents; }
    .filter-panel.is-collapsed .filter-more { display: none; }
    .filter-toggle-btn {
      height: 36px;
      padding: 0 12px;
      border: none;
      background: transparent;
      color: #2f6bff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-toggle-btn:hover { color: #1d4ed8; }
    .form-label { display: inline-flex; align-items: center; min-height: 20px; font-size: 13px; font-weight: 500; color: #334155; }
    .form-label.required::before { content: "*"; margin-right: 3px; color: #ef4444; font-weight: 600; }
    .lang-var-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .lang-var-chip {
      height: 30px;
      padding: 0 12px;
      border: 1px solid #d5ddeb;
      border-radius: 6px;
      background: #fff;
      color: #334155;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color .15s ease, color .15s ease, background .15s ease;
    }
    .lang-var-chip:hover { border-color: #2f6bff; color: #2f6bff; background: #f0f6ff; }
    .icon-action-btn {
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
      flex: 0 0 32px;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      background: #2f6bff;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(47,107,255,0.25);
      transition: transform .12s ease, background .12s ease;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    .icon-action-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
    .icon-action-btn:hover { background: #245cf0; }
    .icon-action-btn:active { transform: translateY(1px); }
    .icon-action-btn.success { background: #16a34a; box-shadow: 0 3px 8px rgba(22,163,74,0.24); }
    .icon-action-btn.success:hover { background: #15803d; }
    .icon-action-btn.danger { background: #ef4444; box-shadow: 0 3px 8px rgba(239,68,68,0.24); }
    .icon-action-btn.danger:hover { background: #dc2626; }
    .data-table thead th {
      height: 40px;
      background: #f3f6fb;
      color: #334155;
      font-weight: 600;
      font-size: 14px;
      text-align: left;
    }
    .data-table tbody td {
      height: 48px;
      color: #1f2937;
      font-size: 14px;
      border-top: 1px solid #edf1f7;
      vertical-align: middle;
    }
    .toast-host {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
    }
    .toast-item {
      min-width: 280px;
      max-width: 420px;
      min-height: 44px;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid #e6eaf2;
      background: #fff;
      box-shadow: 0 10px 28px rgba(15,23,42,0.14);
      color: #1f2937;
      font-size: 13px;
      line-height: 20px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      transform: translateY(10px);
      opacity: 0;
      transition: transform .18s ease, opacity .18s ease;
      pointer-events: auto;
    }
    .toast-item.show { transform: translateY(0); opacity: 1; }
    .toast-icon {
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      margin-top: 1px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }
    .toast-success { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
    .toast-success .toast-icon { background: #22c55e; }
    .toast-warn { border-color: #fde68a; background: #fffbeb; color: #92400e; }
    .toast-warn .toast-icon { background: #f59e0b; }
    .toast-error { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
    .toast-error .toast-icon { background: #ef4444; }
  </style>
</head>
<body class="min-h-screen">

    /** 最近 N 天（含今天）：today-(n-1) → today，YYYY-MM-DD */
    function lastNDaysRange(n = 7) {
      const end = new Date();
      const start = new Date(end);
      start.setDate(start.getDate() - (n - 1));
      const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      return { start: fmt(start), end: fmt(end) };
    }

    /** 样例领取/使用日期对齐到最近 N 天，避免默认日期筛选导致列表为空 */
    function alignDemoReceiveUsageDates(days = 7) {
      const ymd = (ago) => {
        const d = new Date();
        d.setHours(12, 0, 0, 0);
        d.setDate(d.getDate() - Math.max(0, Math.min(days - 1, ago)));
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      };
      const stamp = (ago, time = "10:00") => {
        const [y, m, day] = ymd(ago).split("-");
        return `${day}-${m}-${y} ${time}`;
      };
      const receivePlans = [
        { ago: 1, time: "10:23", useAgo: 1, useTime: "10:23" },
        { ago: 5, pending: true },
        { ago: 2, time: "10:23", useAgo: 2, useTime: "10:23" },
        { ago: 3, time: "09:45", useAgo: 3, useTime: "12:40" },
        { ago: 5, pending: true },
        { ago: 4, time: "11:10" },
        { ago: 2, time: "14:00" }
      ];
      (state.data.receives || []).forEach((row, idx) => {
        const plan = receivePlans[idx] || { ago: Math.min(idx, days - 1), time: "10:00" };
        // receiveDate 用于默认近 N 天筛选；未领取记录也写入发放日，避免被日期筛掉
        row.receiveDate = ymd(plan.ago);
        row.sent = stamp(plan.ago, plan.time || "10:00");
        if (plan.pending) {
          row.receive = "--";
          row.useTime = "--";
          return;
        }
        row.receive = stamp(plan.ago, plan.time || "10:00");
        if (plan.useAgo != null) row.useTime = stamp(plan.useAgo, plan.useTime || "10:00");
      });
      const usagePlans = [
        { ago: 1, time: "10:23" },
        { ago: 3, time: "14:15" },
        { ago: 4, time: "12:40" },
        { ago: 2, time: "15:20" }
      ];
      (state.data.usages || []).forEach((row, idx) => {
        const plan = usagePlans[idx] || { ago: Math.min(idx, days - 1), time: "10:00" };
        row.useDate = ymd(plan.ago);
        row.useTime = stamp(plan.ago, plan.time || "10:00");
        row.rewardTime = stamp(plan.ago, plan.time || "10:00");
      });
    }

      const status = String(campaign?.status || "");

      return !/^(完成|已完成|已发放完成|已撤销)$/.test(status);
    }

    function campaignTaskIds(campaign) {
      const ids = [];
      if (Array.isArray(campaign?.tasks)) ids.push(...campaign.tasks);
      if (campaign?.task) ids.push(campaign.task);
      return [...new Set(ids.map(String).filter(Boolean))];
    }

    function campaignLinksCoupon(campaign, couponId) {
      const cid = String(couponId || "");
      if (!cid || !campaign) return false;
      if ((campaign.coupons || []).map(String).includes(cid)) return true;
      const taskIds = campaignTaskIds(campaign);
      for (const tid of taskIds) {
        const task = state.data.tasks.find(t => String(t.id) === tid);
        if (task && (task.coupons || []).map(String).includes(cid)) return true;
      }
      return (state.data.batches || []).some(b => {
        if (String(b.campaign) !== String(campaign.id)) return false;
        return String(b.coupon || "").split(/[,，]/).map(s => s.trim()).includes(cid);
      });
    }

    function campaignLinksTask(campaign, taskId) {
      const tid = String(taskId || "");
      if (!tid || !campaign) return false;
      if (campaignTaskIds(campaign).includes(tid)) return true;
      return (state.data.batches || []).some(b => String(b.campaign) === String(campaign.id) && String(b.task) === tid);
    }

      return (state.data.campaigns || []).filter(c => {
        if (!isCampaignDistributionIncomplete(c)) return false;
        if (couponId) return campaignLinksCoupon(c, couponId);
        if (taskId) return campaignLinksTask(c, taskId);
        return false;
      });

    function normalizeModalFooter(footer = "") {
      const html = String(footer || "").trim();
      if (!html) return "";
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      const buttons = [...tmp.querySelectorAll("button")];
      if (!buttons.length) return html;
      // 仅「关闭/知道了」时与顶部叉号重复，去掉底部关闭
      const onlyClose = buttons.every(btn => /^(关闭|知道了)$/.test((btn.textContent || "").trim()));
      return onlyClose ? "" : html;

    function nowStamp() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function formatDisplayTime(value) {
      const text = String(value || "").trim();
      if (!text || text === "--") return "--";
      const iso = text.match(/^(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{2}:\d{2}))?/);
      if (iso) return `${iso[3]}-${iso[2]}-${iso[1]} ${iso[4] || "00:00"}`;
      const slash = text.match(/^(\d{2})-(\d{2})-(\d{4})(?:\s+(\d{2}:\d{2}))?/);
      if (slash) return `${slash[1]}-${slash[2]}-${slash[3]} ${slash[4] || "00:00"}`;
      return text;
    }

    function comparableDateTime(value) {
      const text = String(value || "").trim();
      const display = text.match(/^(\d{2})-(\d{2})-(\d{4})(?:\s+(\d{2}:\d{2}))?/);
      if (display) return `${display[3]}-${display[2]}-${display[1]} ${display[4] || "00:00"}`;
      return text;
    }

    function pushCouponLog(row, content, operator = "Jenny") {
      if (!row) return;
      if (!Array.isArray(row.logs)) row.logs = [];
      row.logs.unshift({ operator, time: nowStamp(), content });
    }

    function formatTaskCoupons(coupons = []) {
      if (!coupons.length) return "--";
      const grouped = coupons.reduce((acc, id) => {
        acc[id] = (acc[id] || 0) + 1;
        return acc;
      }, {});
      return Object.entries(grouped).map(([id, count]) => count > 1 ? `${id}*${count}` : id).join("、");
    }

    function taskCreatedCouponRecords(taskId = "") {
      return (state.data.couponCreates || []).filter(r => String(r.taskId || "") === String(taskId || ""));

      return ids.length ? formatTaskCoupons(ids) : "--";

    }

    function nextCouponCreateRecordId() {
      const max = Math.max(0, ...(state.data.couponCreates || []).map(r => Number(String(r.id || "").replace(/\D/g, "")) || 0));
      return `RC${max + 1}`;
    }

    function appendCouponCreateRecord(task, templateId) {
      if (!task?.id || !templateId) return null;
      const coupon = state.data.coupons.find(c => c.id === templateId);
      const row = {
        id: nextCouponCreateRecordId(),
        project: task.app || coupon?.project || "",
        couponId: nextCreatedCouponId(),
        couponType: coupon?.type || "--",
        amount: coupon?.amount || "--",
        ratio: coupon?.ratio || "",
        validDays: coupon?.validDays || "7",
        taskId: task.id,
        taskName: task.name || "",
        taskType: task.type || "",
        condition: task.condition || "--",
        templateId: String(templateId),
        taskValidType: task.taskValidType || "",
        taskValidDays: task.taskValidDays || ""
      };
      if (!Array.isArray(state.data.couponCreates)) state.data.couponCreates = [];
      state.data.couponCreates.push(row);
      return row;
    }

    function ensureTaskCouponCreateRecords() {
      (state.data.tasks || []).forEach(task => {
        if (!task || task.type === "理财") return;
        const templateIds = task.coupons || [];
        const needMap = templateIds.reduce((acc, id) => {
          const key = String(id);
          acc[key] = (acc[key] || 0) + 1;
          return acc;
        }, {});
        Object.entries(needMap).forEach(([templateId, need]) => {
          const have = taskCreatedCouponRecords(task.id).filter(r => String(r.templateId) === templateId).length;
          for (let i = have; i < need; i += 1) appendCouponCreateRecord(task, templateId);
        });
      });
    }

    function campaignStatuses(row) {
      return Array.isArray(row.statuses) && row.statuses.length ? row.statuses : [row.status || "执行中"];
    }

    function campaignTaskIds(row) {
      if (Array.isArray(row.tasks)) return row.tasks;
      return row.task && row.task !== "--" ? [row.task] : [];
    }

    function campaignTaskNames(row) {
      return campaignTaskIds(row).map(id => state.data.tasks.find(t => t.id === id)?.name || id).join("、") || "--";
    }

    function campaignBatches(row) {
      if (!row) return [];
      const matched = state.data.batches.filter(b =>
        !isAuditRelatedBatchStatus(b.status) &&
        (b.campaign === row.id || b.id === row.batch || b.id.startsWith(`${row.id}-`))
      );
      if (matched.length) {
        return matched.slice().sort((a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || "")) || String(a.id).localeCompare(String(b.id)));
      }
      // 待审核/审核拒绝活动不生成批次，也不再回落虚构批次行
      if (isCampaignPendingAudit(row) || /审核拒绝/.test(String(row.status || ""))) return [];
      return row.batch ? [{ id: row.batch, campaign: row.id, task: row.task }] : [];
    }

    function isLoopCampaign(row = {}) {
      return String(row.mode || row.deliverType || "").includes("循环");
    }

    // 自定义红包统一任务ID为 T0；其它任务原样返回
    function normalizeBatchTaskId(taskId) {
      const t = String(taskId || "").trim();
      if (!t || t === "--" || t === "CUSTOM" || /自定义/.test(t)) return "T0";
      return t;
    }

    // 统一格式：活动ID-任务ID-段序号（如 1-T1-1、2-T4-1）
    function makeBatchId(campaignId, taskId, loopRound = null) {
      const tid = normalizeBatchTaskId(taskId);
      const n = Number(loopRound);
      const cycle = Number.isFinite(n) && n > 0 ? n : 1;
      return `${campaignId}-${tid}-${cycle}`;
    }

    function nextLoopRound(campaignId, taskId) {
      const tid = normalizeBatchTaskId(taskId);
      const prefix = `${campaignId}-${tid}-`;
      const rounds = state.data.batches
        .map(b => String(b.id || ""))
        .filter(id => id.startsWith(prefix))
        .map(id => Number(id.slice(prefix.length)))
        .filter(n => Number.isFinite(n) && n > 0);
      return (rounds.length ? Math.max(...rounds) : 0) + 1;
    }

    // 活动侧展示用：去掉段序号后缀（4-T4-1 → 4-T4，14-T0-1 → 14-T0）
    function batchConfigId(batchId) {
      const id = String(batchId || "");
      return id.replace(/-(\d+)$/, "") || id;
    }

    function loopPublishTagHtml() {
      return `<span class="badge badge-neutral">循环发布</span>`;
    }

    function campaignDeliverTimeText(row = {}) {
      const text = row.deliverTime || row.deliverAt || "";
      if (!text || text === "--") return "--";
      return formatDisplayTime(text);
    }

    // 任务批次发放时间：取该批次实际发放/创建时间，不用活动循环规则文案
    function batchDeliverTimeText(batch = {}) {
      const text = batch.deliverTime || batch.issueTime || batch.createdAt || "";
      if (!text || text === "--") return "--";
      return formatDisplayTime(text);
    }

    // 任务批次筛选：配置 ID（1-T1）可匹配其所有段序号（1-T1-1、1-T1-2）
    function batchIdMatchesFilter(batchId, query) {
      const id = String(batchId || "");
      const q = String(query || "").trim();
      if (!q) return true;
      if (id === q) return true;
      if (batchConfigId(id) === q || batchConfigId(id) === batchConfigId(q)) return true;
      if (id.startsWith(`${q}-`)) return true;
      return false;
    }

    function batchTaskTypeOptions() {
      // [临时隐藏] 理财：visibleTaskTypeOptions 会按 SHOW_FINANCE_TASK 过滤
      return visibleTaskTypeOptions(["无任务", "充值", "实盘交易", "理财"]);
    }

    function batchCouponTypeOptions() {
      return ["现金红包", "手续费抵扣红包", "盈亏抵扣红包", "提现免佣券", "自定义红包"];
    }

    function batchTaskType(row = {}) {
      if (row.taskType && row.taskType !== "自定义任务") return row.taskType;
      if (row.taskType === "自定义任务") return "无任务";
      const task = batchTask(row);
      return task.type || "--";
    }

    function batchCouponType(row = {}) {
      if (row.couponType) return row.couponType;
      const raw = String(row.coupon || "").trim();
      if (!raw || raw === "--") return "--";
      if (raw === "自定义" || /自定义/.test(raw)) return "自定义红包";
      const firstId = raw.split(/[、,]/).map(s => s.trim()).filter(Boolean)[0];
      const coupon = state.data.coupons.find(c => c.id === firstId);
      return coupon?.type || "--";
    }

    function openBatchListByConfig(configOrBatchId) {
      const configId = batchConfigId(configOrBatchId);
      state.filters.batch = {
        campaignId: configId,
        activityName: "",
        project: "",
        region: "",
        status: "",
        taskType: "",
        couponType: "",
        start: "",
        end: ""
      };
      state.selectedBatchId = "";
      switchPage("batch-list", { mainTab: "batch" });
    }

    // 活动列表/详情：按配置去重（同一任务多轮循环只展示一条）
    function campaignConfigBatches(row) {
      const batches = campaignBatches(row);
      const map = new Map();
      batches.forEach(b => {
        const configId = batchConfigId(b.id);
        const [received, total] = String(b.issue || "0/0").split("/").map(n => Number(n) || 0);
        const prev = map.get(configId);
        if (!prev) {
          map.set(configId, {
            ...b,
            id: configId,
            configId,
            linkId: b.id,
            receivedSum: received,
            totalSum: total,
            issue: `${received}/${total}`
          });
          return;
        }
        const receivedSum = prev.receivedSum + received;
        const totalSum = prev.totalSum + total;
        const newer = String(b.createdAt || "").localeCompare(String(prev.createdAt || "")) >= 0;
        map.set(configId, {
          ...prev,
          task: prev.task || b.task,
          coupon: prev.coupon || b.coupon,
          linkId: newer ? b.id : prev.linkId,
          createdAt: newer ? b.createdAt : prev.createdAt,
          status: newer ? b.status : prev.status,
          receivedSum,
          totalSum,
          issue: `${receivedSum}/${totalSum}`
        });
      });
      const list = [...map.values()];
      const taskOrder = campaignTaskIds(row);
      list.sort((a, b) => {
        const ia = taskOrder.indexOf(a.task);
        const ib = taskOrder.indexOf(b.task);
        if (ia !== -1 || ib !== -1) return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        return String(a.configId).localeCompare(String(b.configId));
      });
      return list;
    }

    function campaignCouponText(row) {
      const ids = Array.isArray(row.coupons) ? row.coupons : [];
      if (!ids.length && campaignTaskIds(row).some(id => state.data.tasks.find(t => t.id === id)?.type === "理财")) return "--";
      return formatTaskCoupons(ids);
    }

    function campaignAudienceLabel(row = {}) {
      const count = row.audienceCount ?? row.expectedUsers ?? row.users ?? 0;
      const type = row.audienceType
        || (String(row.audience || "").startsWith("导入") ? "导入"
          : String(row.audience || "").startsWith("添加") ? "添加"
          : (row.audience || row.tagVerseName ? "TagVerse" : ""));
      if (type === "导入") return `导入${count}人`;
      if (type === "添加") return `添加${count}人`;
      if (type === "TagVerse") return row.audience || row.tagVerseName || "--";
      return row.audience || "--";
    }

    function pushCampaignLog(row, content, operator = "Jenny") {
      if (!row) return;
      if (!Array.isArray(row.logs)) row.logs = [];
      row.logs.unshift({ operator, time: nowStamp(), content });
    }

    function nextCampaignId() {
      const refs = [
        ...state.data.campaigns.map(c => c.id),
        ...state.data.batches.flatMap(b => [b.id, b.campaign]),
        ...state.data.audits.flatMap(a => [a.activity, a.batch]),
        ...state.data.receives.map(r => r.batch),
        ...state.data.usages.map(u => u.batch)
      ];
      // 活动ID无前缀 A；兼容历史 A12 / 新格式 12、12-T1-1
      const nums = refs
        .map(id => {
          const m = String(id || "").match(/^A?(\d+)(?:-|$)/);
          return m ? Number(m[1]) : NaN;
        })
        .filter(Number.isFinite);
      const next = (nums.length ? Math.max(...nums) : 0) + 1;
      return `${next}`;
    }

    function isAuditRelatedBatchStatus(status) {
      return /待审核|审核中|等待审核|审核拒绝/.test(String(status || ""));
    }

    function isCampaignPendingAudit(row = {}) {
      return isAuditPending(row.status) || String(row.status || "") === "待审核";
    }

    function ensureCampaignBatches(campaign, status = "执行中") {
      if (!campaign) return [];
      const loop = isLoopCampaign(campaign);
      const taskIds = campaignTaskIds(campaign).map(normalizeBatchTaskId);
      const batchTaskIds = taskIds.length ? taskIds : ["T0"];
      const cycle = 1;
      const created = [];
      batchTaskIds.slice().reverse().forEach(taskId => {
        const tid = normalizeBatchTaskId(taskId);
        const batchId = makeBatchId(campaign.id, tid, cycle);
        if (state.data.batches.some(b => b.id === batchId)) return;
        const isCustom = tid === "T0";
        const linkedTask = isCustom ? null : state.data.tasks.find(t => t.id === tid);
        const batch = {
          id: batchId,
          campaign: campaign.id,
          task: tid,
          taskType: linkedTask?.type || (isCustom ? "无任务" : "--"),
          coupon: isCustom ? "自定义" : campaignCouponText(campaign),
          couponType: isCustom ? "自定义红包" : (state.data.coupons.find(c => c.id === String(campaignCouponText(campaign)).split(/[、,]/)[0])?.type || "--"),
          issue: `0/${campaign.audienceCount || 0}`,
          status,
          project: campaign.project,
          region: "--",
          operator: "Jenny",
          createdAt: nowStamp(),
          reason: "--",
          loopRound: cycle,
          logs: [{ operator: "Jenny", time: nowStamp(), content: loop ? "创建循环任务批次（第1次）" : "创建任务批次" }]
        };
        state.data.batches.unshift(batch);
        created.push(batch);
      });
      campaign.batch = makeBatchId(campaign.id, batchTaskIds[0], cycle);
      return created;
    }

    function createCampaignFromDraft(draft) {
      const loop = draft.deliverType === "循环发放";
      const id = nextCampaignId();
      const batchTaskIds = [];
      draft.taskItems.forEach(item => {
        if (item.custom) {
          batchTaskIds.push("T0");
          return;
        }
        const tid = extractTaskIdFromText(item.task);
        if (tid) batchTaskIds.push(tid);
      });
      if (!batchTaskIds.length) batchTaskIds.push("T0");
      const coupons = draft.taskItems.flatMap(item => String(item.reward).match(/\b\d{4}\b/g) || []);
      const cycle = 1;
      const firstBatchId = makeBatchId(id, batchTaskIds[0], cycle);
      const needsAudit = draft.activityType === "特批活动";
      const row = {
        id,
        name: draft.name,
        audienceType: draft.audienceType,
        audienceCount: draft.audienceType === "TagVerse" ? 12486 : (draft.sidList || []).length,
        audience: draft.audienceType === "TagVerse" ? (draft.tagVerseName || "TagVerse人群") : "",
        importFile: draft.audienceType === "导入" ? (draft.importedFileName || `${id}_import.xlsx`) : "",
        mode: `${draft.activityType} / ${draft.deliverType}`,
        deliverTime: draft.deliverType === "立即发放" ? nowStamp() : (draft.deliverType === "定时发放" ? draft.deliverAt : `${draft.loopFreq}${draft.loopPoint ? ` ${draft.loopPoint}` : ""} ${draft.loopTime}`),
        task: batchTaskIds[0] || "--",
        tasks: batchTaskIds.slice(),
        batch: firstBatchId,
        project: draft.project,
        coupons,
        approvalReason: draft.activityType === "特批活动" ? draft.approvalReason : "",
        status: needsAudit ? "待审核" : "执行中",
        statuses: [needsAudit ? "待审核" : "执行中"],
        createdAt: nowStamp(),
        logs: []
      };
      pushCampaignLog(row, LOG_TEXT.campaign.create);
      state.data.campaigns.unshift(row);
      if (needsAudit) {
        const plannedBatches = batchTaskIds.map(taskId => makeBatchId(id, taskId, cycle));
        state.data.audits.unshift({
          rid: `R${Date.now().toString().slice(-6)}`,
          type: "特批活动",
          object: id,
          activity: id,
          activityName: row.name,
          activityKind: "特批活动",
          audience: campaignAudienceLabel(row),
          batchCount: plannedBatches.length,
          expectedUsers: row.audienceCount || 0,
          expectedAmount: "--",
          approvalReason: row.approvalReason || "--",
          batch: plannedBatches[plannedBatches.length - 1] || firstBatchId,
          batches: plannedBatches,
          project: row.project,
          couponId: coupons[0] || "--",
          coupon: coupons[0] || "--",
          couponType: "--",
          users: row.audienceCount || 0,
          amount: "--",
          trigger: "特批活动创建后进入人工审核",
          status: "待审核",
          apply: formatDisplayTime(nowStamp()),
          reviewer: "--",
          reviewTime: "--",
          operator: "Jenny"
        });
      } else {
        ensureCampaignBatches(row, "执行中");
      }
      return row;
    }

    function campaignItemFromTask(task) {
      const taskCoupons = (task.coupons || []).map(id => state.data.coupons.find(c => c.id === id)).filter(Boolean);
      return {

        type: task.type,
        task: `${task.id} ${task.name}${task.condition && task.condition !== "--" ? `；${task.condition}` : ""}`,
        reward: task.type === "理财" ? "理财任务奖励按任务配置展示" : (taskCoupons.length ? taskCoupons.map(c => `${c.id} ${couponTitle(c)}`).join("，") : "--"),
        taskValid: formatTaskValidity(task),
        couponValid: task.type === "理财" ? "--" : (taskCoupons.length ? taskCoupons.map(c => couponValidityWithId(c.id, couponValidDaysText(c.validDays))).join("，") : couponValidDaysText(7))
      };

    function campaignItemTaskId(item) {
      if (!item || item.custom) return "";
      return item.taskId || extractTaskIdFromText(item.task) || "";

    function campaignHasTaskId(taskId) {
      if (!taskId) return false;
      return (state.campaignDraft.taskItems || []).some(item => campaignItemTaskId(item) === taskId);

    function campaignCustomAmounts(item = {}) {
      if (Array.isArray(item.amounts) && item.amounts.length) return item.amounts.map(v => String(v ?? ""));
      if (item.amount != null && String(item.amount).trim() !== "") return [String(item.amount).trim()];
      return [""];
    }

    function syncCampaignCustomReward(item) {
      if (!item || !item.custom) return;
      const amounts = campaignCustomAmounts(item).map(v => String(v || "").trim()).filter(Boolean);
      item.amounts = campaignCustomAmounts(item);
      item.amount = amounts[0] || "";
      item.reward = amounts.length ? amounts.map(a => `自定义现金红包 $${a}`).join("，") : "自定义现金红包";
      item.couponValid = amounts.length > 1 ? amounts.map(() => couponValidDaysText(7)).join("，") : couponValidDaysText(7);

    function batchCampaign(row) {
      const found = state.data.campaigns.find(c => c.id === row.campaign);
      if (found) return found;
      const audit = state.data.audits.find(a => a.activity === row.campaign || a.batch === row.id || (Array.isArray(a.batches) && a.batches.includes(row.id)));
      if (audit) {
        return {
          id: audit.activity || row.campaign,
          name: audit.activityName || audit.object || row.campaign,
          project: audit.project || row.project,
          deliverTime: audit.apply || ""
        };
      }
      return { id: row.campaign, name: row.campaign };
    }

    function batchTask(row) {
      return state.data.tasks.find(t => t.id === row.task) || {};

    function batchCouponIds(row) {
      const task = batchTask(row);
      if (task.type === "理财" || row.coupon === "--") return "--";
      const ids = String(row.coupon || "").split(/[、,]/).filter(Boolean);
      const counts = ids.reduce((acc, id) => {
        acc[id] = (acc[id] || 0) + 1;
        return acc;
      }, {});
      return Object.entries(counts).map(([id, count]) => count > 1 ? `${id}*${count}` : id).join("、") || "--";

      const task = batchTask(row);

    }

      { key: "project", label: "项目", fixed: true, width: 6 },
      { key: "activityId", label: "活动ID", fixed: true, width: 7 },
      { key: "activityName", label: "活动名称", fixed: false, width: 14, defaultOn: true },
      { key: "auditStatus", label: "审核状态", fixed: true, width: 8 },
      { key: "applyTime", label: "申请时间", fixed: false, width: 15, defaultOn: true },
      { key: "reviewTime", label: "审核时间", fixed: false, width: 15, defaultOn: true },
      { key: "auditOpinion", label: "审核意见", fixed: false, width: 22.5, defaultOn: true },
      { key: "ops", label: "操作", fixed: true, width: 9 }
    ];

    function listColumnsOf(kind) {
      if (kind === "usage") return USAGE_LIST_COLUMNS;
      if (kind === "issue") return ISSUE_LIST_COLUMNS;
      return RECEIVE_LIST_COLUMNS;
    }

    function defaultColumnVisibility(defs) {
      return defs.reduce((acc, col) => {
        acc[col.key] = true;
        return acc;
      }, {});
    }

    function getColumnVisibility(kind) {
      const defs = listColumnsOf(kind);
      if (!state.columnConfig[kind]) state.columnConfig[kind] = defaultColumnVisibility(defs);
      defs.forEach(col => {
        if (col.fixed) state.columnConfig[kind][col.key] = true;
        else if (state.columnConfig[kind][col.key] === undefined) state.columnConfig[kind][col.key] = true;
      });
      return state.columnConfig[kind];
    }

    function visibleColumns(kind) {
      const defs = listColumnsOf(kind);
      const vis = getColumnVisibility(kind);
      const shown = defs.filter(col => col.fixed || vis[col.key]);
      return shown.length ? shown : defs.filter(col => col.fixed);
    }

    function columnConfigButtonHtml(kind) {
      return `<button id="btnColumnConfig" type="button" class="${btnClass(false,true)}" data-col-config="${kind}">列表配置</button>`;
    }

    function openColumnConfigModal(kind) {
      const defs = listColumnsOf(kind);
      const vis = { ...getColumnVisibility(kind) };
      const selectable = defs.filter(col => col.key !== "select" && col.key !== "ops");
      const toggleable = selectable.filter(col => !col.fixed);
      const fixedCols = selectable.filter(col => col.fixed);
      fixedCols.forEach(col => { vis[col.key] = true; });
      const renderBody = () => {
        const checkedCount = selectable.filter(col => vis[col.key]).length;
        return `<div class="space-y-3 text-[13px]">
          <div class="flex items-center justify-between">
            <div class="text-[#64748b]">勾选需要在列表中展示的列（共 ${selectable.length} 列，固定 ${fixedCols.length} 列，已选 ${checkedCount} 列）</div>
            <div class="flex gap-2">
              <button type="button" id="btnColSelectAll" class="${btnClass(false,true)}">全选</button>
              <button type="button" id="btnColSelectNone" class="${btnClass(false,true)}">全不选</button>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-x-4 gap-y-2 max-h-[52vh] overflow-auto border border-line rounded p-3">
            ${selectable.map(col => `<label class="flex items-center gap-2 py-1 ${col.fixed ? "text-[#94a3b8]" : ""}"><input type="checkbox" data-col-toggle="${col.key}" class="accent-primary" ${vis[col.key] ? "checked" : ""} ${col.fixed ? "disabled" : ""}><span>${col.label}${col.fixed ? `<span class="text-[11px] text-[#94a3b8]">（固定列）</span>` : ""}</span></label>`).join("")}
          </div>
        </div>`;
      };
      openModal({
        title: "列表展示配置",
        size: "xl",
        body: renderBody(),
        footer: `<button class="${btnClass(false,true)}" data-close-modal>取消</button><button id="btnColumnConfigReset" class="${btnClass(false,true)}">恢复默认</button><button id="btnColumnConfigSave" class="${btnClass(true,true)}">确定</button>`
      });
      const refreshChecks = () => {
        el.modalBody.innerHTML = renderBody();
        bindChecks();
      };
      const bindChecks = () => {
        document.querySelectorAll("[data-col-toggle]").forEach(chk => {
          chk.onchange = () => {
            const col = selectable.find(c => c.key === chk.dataset.colToggle);
            if (!col || col.fixed) return;
            vis[chk.dataset.colToggle] = chk.checked;
            refreshChecks();
          };
        });
        const selectAll = document.getElementById("btnColSelectAll");
        if (selectAll) selectAll.onclick = () => { selectable.forEach(col => { vis[col.key] = true; }); refreshChecks(); };
        const selectNone = document.getElementById("btnColSelectNone");
        if (selectNone) selectNone.onclick = () => {
          toggleable.forEach(col => { vis[col.key] = false; });
          fixedCols.forEach(col => { vis[col.key] = true; });
          refreshChecks();
        };
      };
      bindChecks();
      document.getElementById("btnColumnConfigReset").onclick = () => {
        const defaults = defaultColumnVisibility(defs);
        selectable.forEach(col => { vis[col.key] = col.fixed ? true : defaults[col.key] !== false; });
        refreshChecks();
        notify("success", "已恢复默认列配置");
      };
      document.getElementById("btnColumnConfigSave").onclick = () => {
        fixedCols.forEach(col => { vis[col.key] = true; });
        const selected = selectable.filter(col => vis[col.key]);
        if (!selected.length) return notify("error", "请至少选择一列展示");
        const next = getColumnVisibility(kind);
        selectable.forEach(col => { next[col.key] = col.fixed ? true : !!vis[col.key]; });
        // 选择/操作列随列表能力保留
        if (defs.some(c => c.key === "select")) next.select = true;
        if (defs.some(c => c.key === "ops")) next.ops = true;
        state.columnConfig[kind] = next;
        closeModal();
        render();
        notify("success", "列表展示配置已保存");
      };
      bindModalClose();
    }

    function stickyStyleForColumns(cols) {
      let left = 0;
      const map = {};
      cols.forEach(col => {
        if (col.fixed) {
          map[col.key] = left;
          left += col.width || 80;
        }
      });
      return map;
    }

    function activityIdFromBatch(batch) {
      if (!batch) return "--";
      const campaign = state.data.campaigns.find(c => c.batch === batch || (c.tasks || []).some(t => `${c.id}-${t}` === batch));
      if (campaign) return campaign.id;
      const m = String(batch).match(/^([A-Z]+\d+)/i);
      return m ? m[1] : "--";
    }

    function buildReceiveAuditRows() {
      return state.data.audits.filter(a => auditTabOf(a) === "receive").map(a => {
        const sid = String(a.sid || a.object || "").replace(/^SID/i, "");
        const coupon = state.data.coupons.find(c => String(c.id) === String(a.couponId));
        const couponType = a.couponType || coupon?.type || "--";
        const amount = a.amount || (coupon ? (typeof coupon.amount === "number" ? `$${coupon.amount}` : String(coupon.amount)) : "--");
        return {
          rid: a.rid,
          auditable: true,
          project: auditProject(a),
          sid,
          batch: a.batch || "--",
          activityId: a.activity || activityIdFromBatch(a.batch),
          couponId: a.couponId || "--",
          couponTitle: auditCouponTitle({ ...a, couponType, amount }),
          amount,
          couponType,
          auditStatus: a.status || "--",
          applyTime: a.apply || "--",
          reviewTime: a.reviewTime || "--",
          reviewer: a.reviewer || "--",
          auditOpinion: a.status === "审核拒绝" ? (a.auditOpinion || "人工审核拒绝") : (a.auditOpinion || ""),
          redPacketCount: a.redPacketCount,
          dailyCustomCount: a.dailyCustomCount,
          trigger: a.trigger || "--"
        };
      });
    }

    function buildUsageAuditRows() {
      return state.data.audits.filter(a => auditTabOf(a) === "usage").map(a => {
        const sid = String(a.sid || a.object || "").replace(/^SID/i, "");
        const amountNum = Number(String(a.faceValue ?? "").replace(/[^0-9.-]/g, ""));
        return {
          rid: a.rid,
          auditable: true,
          project: auditProject(a),
          sid,
          couponId: a.couponId || "--",
          couponType: a.couponType || "--",
          amount: Number.isFinite(amountNum) ? amountNum.toFixed(2) : "--",
          deduct: a.deduct || "--",
          depositOrder: a.depositOrder || "--",
          useTime: a.useTime || "--",
          reviewTime: a.reviewTime || "--",
          auditStatus: a.status || "--",
          auditMethod: a.auditMethod || "--",
          reviewer: a.reviewer || "--",
          // 自动审核已有审核方式标识，备注不重复写自动通过理由
          remark: a.auditMethod === "自动审核" ? "--" : (a.remark || "--"),
          region: a.region || "--"
        };
      });
    }

    function isAuditPending(status) {
      return status === "待审核" || status === "等待审核";
    }

    function auditCategory(row) {
      if (row.type === "特批活动") return "special";
      if (row.type === "自定义红包") return "batch";
      if (row.type === "使用审核") return "usage";
      return "redpacket";
    }

    function auditTabOf(rowOrKey) {
      const key = typeof rowOrKey === "string" ? rowOrKey : auditCategory(rowOrKey);
      if (key === "batch" || key === "special" || key === "issue") return "issue";
      if (key === "redpacket" || key === "receive") return "receive";
      return "usage";
    }

    function auditTypeLabel(row) {
      const cat = auditCategory(row);
      if (cat === "special") return "特批活动";
      if (cat === "batch") return "任务批次";
      if (cat === "usage") return "使用审核";
      return "领取审核";
    }

    function auditIssueBatchIds(row) {
      if (!row) return [];
      const activityId = row.activity || "";
      const fromData = activityId
        ? state.data.batches.filter(b => b.campaign === activityId || b.id.startsWith(`${activityId}-`))
        : [];
      const fromRowIds = Array.isArray(row.batches)
        ? row.batches.filter(Boolean)
        : (row.batch && row.batch !== "--" ? [row.batch] : []);
      const fromRow = fromRowIds.map(id => state.data.batches.find(b => b.id === id) || { id, task: id });
      const merged = [];
      const seenId = new Set();
      [...fromRow, ...fromData].forEach(b => {
        if (!b?.id || seenId.has(b.id)) return;
        seenId.add(b.id);
        merged.push(b.id);
      });
      return merged.sort((a, b) => String(a).localeCompare(String(b)));
    }

    function auditBatchLinksHtml(batchIds) {
      const ids = (batchIds || []).filter(id => id && id !== "--");
      if (!ids.length) return "--";
      return `<div class="flex flex-col gap-1 items-start">${ids.map(id =>
        `<a class="text-primary hover:underline whitespace-nowrap" data-nav="${makeNav("batch","batch-detail","batch","id",id)}" title="查看批次详情">${id}</a>`
      ).join("")}</div>`;
    }

    function auditIssueAmount(row) {
      if (auditCategory(row) === "special") return row.expectedAmount || row.amount || "--";
      const batch = state.data.batches.find(b => b.id === row.batch);
      if (batch) {
        const total = batchTotalAmount(batch);
        if (total !== "--") return `$${total}`;
      }
      return row.amount || row.expectedAmount || "--";
    }

    function auditIssueTriggerOrReason(row) {
      if (auditCategory(row) === "special") return row.approvalReason || "--";
      const trigger = row.trigger && row.trigger !== "--" ? row.trigger : "";
      const reason = (row.approvalReason || "").trim();
      if (trigger && reason) return `${trigger}；${reason}`;
      return trigger || reason || "--";
    }

    function auditProject(row) {
      if (row?.project) return row.project;
      const campaign = state.data.campaigns.find(c => c.id === row.activity);
      if (campaign?.project) return campaign.project;
      const batch = state.data.batches.find(b => b.id === row.batch);
      if (batch?.project) return batch.project;
      const sid = String(row.sid || row.object || "").replace(/^SID/i, "");
      const receive = state.data.receives.find(r => String(r.sid) === sid);
      return receive?.project || "--";
    }

    function auditMeta(rowOrKey) {
      const key = typeof rowOrKey === "string" ? rowOrKey : auditCategory(rowOrKey);
      const map = {
        receive: {
          type: "领取审核",
          granularity: "SID + 任务批次",
          trigger: "用户红包拥有数量超过20；单个用户当日已领自定义红包 >= 1张",
          impact: "审核通过：该SID在该任务批次内继续发放红包；审核拒绝：该SID对应红包状态变为发放失败，失败原因为人工审核拒绝。不影响活动主状态，批次可继续执行。"
        },
        redpacket: {
          type: "领取审核",
          granularity: "SID + 任务批次",
          trigger: "用户红包拥有数量超过20；单个用户当日已领自定义红包 >= 1张",
          impact: "审核通过：该SID在该任务批次内继续发放红包；审核拒绝：该SID对应红包状态变为发放失败，失败原因为人工审核拒绝。不影响活动主状态，批次可继续执行。"
        },
        issue: {
          type: "发放审核",
          granularity: "任务批次 / 特批活动",
          trigger: "任务批次：单个自定义红包金额 > $100；当日自定义红包发放总额 > $1000；当日自定义红包发放笔数 > 20笔。特批活动：创建后进入人工审核，审核通过后才允许执行发放。",
          impact: "任务批次审核通过后继续发放，拒绝后该批次审核拒绝；特批活动审核通过后活动变为执行中，拒绝后活动及下属批次同步审核拒绝。"
        },
        batch: {
          type: "发放审核",
          granularity: "任务批次",
          trigger: "单个自定义红包金额 > $100；当日自定义红包发放总额 > $1000；当日自定义红包发放笔数 > 20笔",
          impact: "审核通过：该任务批次继续发放；审核拒绝：该任务批次状态变为审核拒绝，不影响同活动下其他任务批次。若活动只有一个任务批次，则活动同步审核拒绝。"
        },

          type: "发放审核",
          granularity: "特批活动",
