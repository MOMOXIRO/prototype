          impact: "审核通过：活动状态由待审核变为执行中并生成任务批次；审核拒绝或活动撤销：不生成任务批次。撤销待审核活动时，对应发放审核记录同步变为已撤销。"
        },
        usage: {
          type: "使用审核",
          granularity: "入金订单",
          trigger: "当天使用红包数量超过10个；单个红包超过50美金；黑名单",
          impact: "人工审核通过：入金生效；审核拒绝：该笔入金不生效，并记录审核备注。"
        }
      };
      return map[key] || map.receive;
    }

    function linkedCouponId(id) {
      // 审核列表红包ID不跳转，统一纯文本展示
      if (!id || id === "--") return "--";
      return String(id);
    }

    function parseDeductAmount(value) {
      const num = Number(String(value ?? "").replace(/[^0-9.-]/g, ""));
      return Number.isFinite(num) ? num : 0;
    }

    function emptyAuditFilters() {
      return { type: "", object: "", activity: "", batch: "", project: "", couponId: "", couponName: "", sid: "", mt4Order: "", depositOrder: "", couponType: "", region: "", auditMethod: "", status: "", reviewer: "", start: "", end: "", reviewStart: "", reviewEnd: "" };
    }

    function applyAuditDecision(row, decision, opinion = "") {
      if (!row) return;
      row.status = decision === "pass" ? "审核通过" : "审核拒绝";
      row.reviewer = "Jenny";
      row.reviewTime = nowStamp();
      row.auditOpinion = opinion || (decision === "pass" ? (auditCategory(row) === "usage" ? "同意使用" : "同意发放") : "人工审核拒绝");
      if (auditCategory(row) === "usage") {
        row.remark = opinion || (decision === "pass" ? "审核通过" : "审核拒绝");
      }
      const category = auditCategory(row);
      if (category === "batch" || category === "special") {
        const campaign = state.data.campaigns.find(x => x.id === row.activity);
        if (campaign) {
          campaign.status = decision === "pass" ? "执行中" : "审核拒绝";
          campaign.statuses = [campaign.status];
          if (decision === "pass") {
            ensureCampaignBatches(campaign, "执行中");
            pushCampaignLog(campaign, LOG_TEXT.campaign.auditPass);
          } else {
            pushCampaignLog(campaign, LOG_TEXT.campaign.auditReject);
          }
        }
      }
    }

    function auditDecisionRadiosHtml(name = "auditDecision", passValue = "pass", rejectValue = "reject", checked = "pass") {
      return `<div class="flex items-center gap-5 h-9">
            <label class="inline-flex items-center gap-2 cursor-pointer text-[13px] text-[#334155]">
              <input type="radio" name="${name}" value="${passValue}" class="accent-primary" ${checked === passValue ? "checked" : ""}>
              <span>通过</span>
            </label>
            <label class="inline-flex items-center gap-2 cursor-pointer text-[13px] text-[#334155]">
              <input type="radio" name="${name}" value="${rejectValue}" class="accent-primary" ${checked === rejectValue ? "checked" : ""}>
              <span>拒绝</span>
            </label>
          </div>`;
    }

    function selectedAuditDecision(name = "auditDecision", fallback = "pass") {
      return document.querySelector(`input[name="${name}"]:checked`)?.value || fallback;
    }

    function setAuditDecision(name, value) {
      const elRadio = document.querySelector(`input[name="${name}"][value="${value}"]`);
      if (elRadio) elRadio.checked = true;
    }

    function auditReviewBody(rows, batchMode = false, selectedCount = rows.length) {
      const first = rows[0];
      const meta = auditMeta(first || state.auditTab);
      const cat = first ? auditCategory(first) : "";
      const hitTrigger = first?.trigger && first.trigger !== "--" ? first.trigger : "";
      const decisionForm = `<div class="grid grid-cols-[160px_1fr] gap-3">
            <div><label class="form-label required mb-1">审核结论</label>${auditDecisionRadiosHtml("auditDecision")}</div>
            <div><label class="form-label mb-1">审核意见</label><textarea id="auditOpinion" class="w-full min-h-[86px] border border-line rounded px-3 py-2" placeholder="填写审核意见，拒绝时建议说明原因"></textarea></div>
          </div>`;
      if (batchMode) {
        const isReceiveBatch = state.auditTab === "receive" || cat === "redpacket";
        const isUsageBatch = state.auditTab === "usage" || cat === "usage";
        const head = isReceiveBatch
          ? `<tr><th class="text-left px-2 py-1">SID</th><th class="text-left px-2 py-1">任务批次</th><th class="text-left px-2 py-1">用户持有红包数</th><th class="text-left px-2 py-1">当日已领自定义红包</th><th class="text-left px-2 py-1">触发规则</th></tr>`
          : isUsageBatch
            ? `<tr><th class="text-left px-2 py-1">SID</th><th class="text-left px-2 py-1">红包ID</th><th class="text-left px-2 py-1">实际抵扣金额</th><th class="text-left px-2 py-1">触发规则</th></tr>`
            : `<tr><th class="text-left px-2 py-1">活动ID</th><th class="text-left px-2 py-1">触发规则/申请理由</th></tr>`;
        const body = rows.map(row => {
          if (isReceiveBatch) {
            return `<tr class="border-t border-line"><td class="px-2 py-1">${String(row.sid || row.object || "").replace(/^SID/i, "")}</td><td class="px-2 py-1">${row.batch || "--"}</td><td class="px-2 py-1">${row.redPacketCount ?? "--"}</td><td class="px-2 py-1">${row.dailyCustomCount ?? "--"}</td><td class="px-2 py-1">${row.trigger || "--"}</td></tr>`;
          }
          if (isUsageBatch) {
            return `<tr class="border-t border-line"><td class="px-2 py-1">${String(row.sid || row.object || "").replace(/^SID/i, "")}</td><td class="px-2 py-1">${row.couponId || "--"}</td><td class="px-2 py-1">${row.deduct || "--"}</td><td class="px-2 py-1">${row.trigger && row.trigger !== "--" ? row.trigger : "--"}</td></tr>`;
          }
          return `<tr class="border-t border-line"><td class="px-2 py-1">${row.activity || activityIdFromBatch(row.batch) || "--"}</td><td class="px-2 py-1">${auditIssueTriggerOrReason(row)}</td></tr>`;
        }).join("");
        return `<div class="space-y-4 text-[13px]">
          <div class="rounded border border-[#bfdbfe] bg-[#eff6ff] px-3 py-2 text-primary font-medium">已选择${selectedCount}条记录，其中待审核${rows.length}条，已审核记录将自动跳过。</div>
          <div class="max-h-[180px] overflow-auto border border-line rounded">
            <table class="w-full text-[12px]">
              <thead class="bg-[#f8faff]">${head}</thead>
              <tbody>${body}</tbody>
            </table>
          </div>
          ${decisionForm}
        </div>`;
      }
      if (cat === "usage") {
        const usageHit = first?.trigger && first.trigger !== "--" ? first.trigger : "";
        return `<div class="space-y-4 text-[13px]">
          <div class="border border-line rounded p-3 grid grid-cols-2 gap-2 text-[12px]">
            <div><span class="text-[#64748b]">SID：</span>${first?.sid || "--"}</div>
            <div><span class="text-[#64748b]">红包ID：</span>${first?.couponId || "--"}</div>
            <div><span class="text-[#64748b]">红包类型：</span>${first?.couponType || "--"}</div>
            <div><span class="text-[#64748b]">金额：</span>${(() => { const n = Number(String(first?.faceValue ?? "").replace(/[^0-9.-]/g, "")); return Number.isFinite(n) ? n.toFixed(2) : "--"; })()}</div>
            <div><span class="text-[#64748b]">实际抵扣金额：</span>${first?.deduct || "--"}</div>
            <div><span class="text-[#64748b]">入金订单：</span>${first?.depositOrder || "--"}</div>
          </div>
          <div class="border border-line rounded p-3">
            <div class="font-semibold mb-2">触发审核理由</div>
            <div class="text-[12px] text-primary leading-6">${usageHit ? `本次命中：${usageHit}` : "--"}</div>
          </div>
          ${decisionForm}
        </div>`;
      }
      if (cat === "redpacket") {
        const sid = String(first?.sid || first?.object || "").replace(/^SID/i, "");
        return `<div class="space-y-4 text-[13px]">
          <div class="border border-line rounded p-3 grid grid-cols-2 gap-2 text-[12px]">
            <div><span class="text-[#64748b]">SID：</span>${sid || "--"}</div>
            <div><span class="text-[#64748b]">任务批次：</span>${first?.batch || "--"}</div>
            <div><span class="text-[#64748b]">红包ID：</span>${first?.couponId || "--"}</div>
            <div><span class="text-[#64748b]">红包名称：</span>${first?.coupon || "--"}</div>
            <div><span class="text-[#64748b]">用户持有红包数：</span>${first?.redPacketCount ?? "--"}</div>
            <div><span class="text-[#64748b]">当日已领自定义红包：</span>${first?.dailyCustomCount ?? "--"}</div>
          </div>
          <div class="border border-line rounded p-3">
            <div class="font-semibold mb-2">触发审核理由</div>
            <div class="text-[12px] text-primary leading-6">${hitTrigger ? `本次命中：${hitTrigger}` : "--"}</div>
          </div>
          ${decisionForm}
        </div>`;
      }
      const reasonBlock = cat === "special"
        ? `<div class="border border-line rounded p-3"><div class="font-semibold mb-2">申请原因</div><div class="text-[#475569] leading-6">${first?.approvalReason || "--"}</div></div>`
        : "";
      const campaignInfo = `<div class="border border-line rounded p-3 grid grid-cols-2 gap-2 text-[12px]">
            <div><span class="text-[#64748b]">活动ID：</span>${first?.activity || "--"}</div>
            <div><span class="text-[#64748b]">活动名称：</span>${first?.activityName || first?.object || "--"}</div>
          </div>`;
      return `<div class="space-y-4 text-[13px]">
        ${campaignInfo}
        <div class="border border-line rounded p-3"><div class="font-semibold mb-2">触发审核理由</div><div class="text-[12px] text-primary leading-6">${hitTrigger ? `本次命中：${hitTrigger}` : "--"}</div></div>
        ${reasonBlock}
        ${decisionForm}
      </div>`;
    }

    function openAuditReviewModal(rid, presetDecision = "") {
      const row = state.data.audits.find(r => r.rid === rid);
      if (!row) return;
      if (!isAuditPending(row.status)) return notify("warn", "该记录已完成审核");
      const meta = auditMeta(row);
      openModal({
        title: meta.type,
        body: auditReviewBody([row]),
        footer: `<button class="${btnClass(false,true)}" data-close-modal>取消</button><button id="submitAuditReview" class="${btnClass(true,true)}">确认提交</button>`
      });
      if (presetDecision === "pass" || presetDecision === "reject") setAuditDecision("auditDecision", presetDecision);
      document.getElementById("submitAuditReview").onclick = () => {
        const decision = selectedAuditDecision("auditDecision");
        const opinion = document.getElementById("auditOpinion").value.trim();
        if (decision === "reject" && !opinion) return notify("error", "审核拒绝需填写审核意见");
        applyAuditDecision(row, decision, opinion);
        closeModal();
        notify(decision === "pass" ? "success" : "warn", `${row.rid} ${decision === "pass" ? "审核通过" : "审核拒绝"}`);
        render();
      };
      bindModalClose();
    }

    function openBatchAuditReviewModal() {
      const rows = state.data.audits.filter(r => state.selectedRows.has(r.rid) && auditTabOf(r) === state.auditTab);
      if (!rows.length) return notify("error", "请先勾选当前审核类型下的记录");
      const pendingRows = rows.filter(row => isAuditPending(row.status));
      if (!pendingRows.length) return notify("warn", `已选择${rows.length}条记录，其中待审核0条，已审核记录将自动跳过。`);
      openModal({
        title: "批量审核确认",
        body: auditReviewBody(pendingRows, true, rows.length),
        footer: `<button class="${btnClass(false,true)}" data-close-modal>取消</button><button id="submitBatchAuditReview" class="${btnClass(true,true)}">确认提交</button>`
      });
      document.getElementById("submitBatchAuditReview").onclick = () => {
        const decision = selectedAuditDecision("auditDecision");
        const opinion = document.getElementById("auditOpinion").value.trim();
        if (decision === "reject" && !opinion) return notify("error", "批量拒绝需填写审核意见");
        pendingRows.forEach(row => applyAuditDecision(row, decision, opinion));
        state.selectedRows.clear();
        closeModal();
        notify(decision === "pass" ? "success" : "warn", `已批量${decision === "pass" ? "通过" : "拒绝"} ${pendingRows.length} 条待审核记录`);
        render();
      };
      bindModalClose();
    }

    function taskIdByDisplayName(name, batch = "") {
      const taskIdFromBatch = extractTaskIdFromText(batch);
      if (taskIdFromBatch && state.data.tasks.some(t => t.id === taskIdFromBatch)) return taskIdFromBatch;
      const text = String(name || "");
      const direct = state.data.tasks.find(t => t.name === text || text.includes(t.name) || t.name.includes(text));
      if (direct) return direct.id;
      if (/实盘|交易/.test(text)) return state.data.tasks.find(t => t.type === "实盘交易")?.id || "";
      if (/充值|充/.test(text)) return state.data.tasks.find(t => t.type === "充值")?.id || "";
      if (/理财/.test(text)) return state.data.tasks.find(t => t.type === "理财")?.id || "";
      if (/无任务|奖励|体验金/.test(text)) return state.data.tasks.find(t => t.type === "无任务")?.id || "";
      return "";
    }

    function linkedTaskName(name, batch = "") {
      if (!name || name === "--") return "--";
      const taskId = taskIdByDisplayName(name, batch);
      return taskId ? `<a class="text-primary hover:underline" data-record-task-detail="${taskId}">${name}</a>` : name;
    }

    function linkedCouponName(name) {
      if (!name || name === "--") return "--";
      return `<a class="text-primary hover:underline" data-record-coupon-name="${name}">${name}</a>`;
    }

    function nextTaskId() {
      const refs = [
        ...state.data.tasks.map(t => t.id),
        ...state.data.batches.map(b => b.task),
        ...state.data.batches.map(b => b.id),
        ...state.data.campaigns.flatMap(c => [c.task, ...(c.tasks || [])]),
        ...state.data.audits.map(a => a.batch)
      ];
      const nums = refs
        .flatMap(id => String(id || "").match(/T(\d+)/g) || [])
        .map(m => Number(m.slice(1)))
        .filter(Number.isFinite);
      const next = (nums.length ? Math.max(...nums) : 0) + 1;
      return `T${next}`;
    }

    function extractTaskIdFromText(text = "") {
      const matches = String(text).match(/T\d+/g) || [];
      if (!matches.length) return "";
      const known = matches.find(id => state.data.tasks.some(t => t.id === id));
      return known || matches[matches.length - 1];
    }

    function taskConditionFromDraft(d) {
      if (d.type === "充值") return `充值金额 >= ${d.rechargeAmount || "X"}`;
      if (d.type === "实盘交易") return `实盘手数 >= ${d.tradeLots || "X"}`;
      if (d.type === "理财") return `理财时长${d.financeDays || "X"}天，年化收益${d.financeRate || "X"}%，最低存款金额${d.financeDeposit || "X"}`;
      return "--";
    }

    function normalizeTaskValidType(type = "") {
      if (type === "领取后N天") return "领取后";
      if (type === "发放后N天") return "发放后";
      if (type === "固定日期范围" || type === "日期范围") return "";
      return type || "";
    }

    function formatTaskValidity(taskOrDraft = {}) {
      if (taskOrDraft.type === "无任务") return "--";
      const validType = normalizeTaskValidType(taskOrDraft.taskValidType) || "领取后";
      return `${validType}${taskOrDraft.taskValidDays || "N"}天`;
    }

    function taskLangTypeFromTaskType(type) {
      return type === "充值" ? "充值任务" : type === "实盘交易" ? "实盘交易" : type === "理财" ? "理财任务" : "无任务";
    }

    function fillTemplateParams(template, draft, coupon) {
      const ratio = couponSupportsRatio(coupon) && coupon?.ratio != null && String(coupon.ratio).trim() !== ""
        ? String(coupon.ratio).trim().replace(/%$/, "")
        : (coupon?.id ? (draft.couponRatios?.[coupon.id] || "") : "");
      return (template || "")
        .replaceAll("{amount}", coupon?.amount || "$0")
        .replaceAll("{count}", draft.rechargeAmount || "50")
        .replaceAll("{number}", draft.tradeLots || "3")
        .replaceAll("{days}", draft.financeDays || "30")
        .replaceAll("{rate}", draft.financeRate || "2")
        .replaceAll("{deposit}", draft.financeDeposit || "1000")
        .replaceAll("{ratio}", ratio || "--");
    }

    function defaultTaskDescTemplate(type) {
      if (type === "充值") return "You must first complete a recharge of {count}.";
      if (type === "实盘交易") return "You must first complete the {number}-way trade.";
      if (type === "理财") return "You must keep the deposit for {days} days with {rate}% annualized return and at least {deposit}.";
      return "Open the app to check details and conditions.";
    }

    function normalizeRatioValue(ratio) {
      const raw = String(ratio ?? "").trim().replace(/%$/, "");
      if (!raw) return "";
      const n = Number(raw);
      return Number.isFinite(n) ? String(n) : "";
    }

    function defaultCouponTitleTemplate(type) {
      const map = {
        "现金红包": "{amount} Cash Bonus",
        "手续费抵扣红包": "{amount} Fee Deduction Bonus（{ratio}%）",
        "盈亏抵扣红包": "{amount} P&L Deduction Bonus（{ratio}%）",
        "提现免佣券": "{amount} Commission-Free Withdrawal Coupon"
      };
      return map[type] || "{amount} Cash Bonus";
    }

    function couponTitleTemplate(type, lang = "英文") {
      ensureTaskLangTemplates();
      const configured = String(state.taskLang.titleTemplates[lang]?.[type] || "").trim();
      if (configured) return configured;
      if (lang !== "英文") {
        const en = String(state.taskLang.titleTemplates["英文"]?.[type] || "").trim();
        if (en) return en;
      }
      return defaultCouponTitleTemplate(type);
    }

    function fillCouponTitleTemplate(tpl, amount, ratio) {
      const displayAmount = typeof amount === "number" ? formatAmount(amount) : (formatAmount(parseMoney(amount)) || String(amount || "").trim());
      const ratioVal = normalizeRatioValue(ratio);
      return String(tpl || "")
        .replace(/\{amount\}/g, displayAmount || "")
        .replace(/\{ratio\}/g, ratioVal || "--");
    }

    function resolveCouponTitleTemplate(coupon, lang = "英文") {
      ensureTaskLangTemplates();
      if (!coupon) {
        if (state.taskModal.selectedCouponId === "FINANCE") return "理财任务";
        return "--";
      }
      return fillCouponTitleTemplate(couponTitleTemplate(coupon.type, lang), coupon.amount, coupon.ratio) || "--";
    }

    function defaultTaskCouponConfig(couponId, draft = state.taskModal.draft) {
      ensureTaskLangTemplates();
      const isFinanceConfig = couponId === "FINANCE" || draft?.type === "理财";
      const coupon = isFinanceConfig ? null : state.data.coupons.find(c => c.id === couponId);
      const taskTplType = taskLangTypeFromTaskType(isFinanceConfig ? "理财" : draft.type);
      return state.taskLang.languages.reduce((acc, lang) => {
        const taskTpl = state.taskLang.templates[lang]?.[taskTplType] || defaultTaskDescTemplate(isFinanceConfig ? "理财" : draft.type);
        acc[lang] = {
          title: isFinanceConfig ? "理财任务" : resolveCouponTitleTemplate(coupon, lang),
          desc: fillTemplateParams(taskTpl, draft, coupon)
        };
        return acc;
      }, {});
    }

    function ensureTaskCouponConfig(couponId) {
      const d = state.taskModal.draft || {};
      if (!d.langConfigs) d.langConfigs = {};
      if (!d.langConfigs[couponId]) d.langConfigs[couponId] = defaultTaskCouponConfig(couponId, d);
      state.taskModal.draft = d;
      return d.langConfigs[couponId];
    }

    function isJumpUrlValue(value = "") {
      return /^https?:\/\//i.test(String(value || "").trim());
    }

    function resolveTaskJumpType(task = {}) {
      if (task.jumpType === "URL链接" || task.jumpType === "APP内部跳转") return task.jumpType;
      return isJumpUrlValue(task.jumpUrl || task.appJump) ? "URL链接" : "APP内部跳转";
    }

    const TASK_APP_JUMP_COMMON = ["首页-活动页", "交易页-任务中心", "钱包页-卡券"];
    const TASK_APP_JUMP_BY_TYPE_PROJECT = {
      充值: { Dana: "Dana充值页面", TW: "TW充值页面" },
      实盘交易: { Dana: "Dana交易页面", TW: "TW交易页面" }
    };

    function defaultAppJumpForTask(type = "", project = "") {
      return TASK_APP_JUMP_BY_TYPE_PROJECT[type]?.[project] || "";
    }

    function isProjectDefaultAppJump(value = "") {
      return Object.values(TASK_APP_JUMP_BY_TYPE_PROJECT).some((map) => Object.values(map).includes(value))
        || value === "钱包页-充值";
    }

    function taskAppJumpOptions(project = "", selected = "") {
      const projectPages = project === "TW"
        ? ["TW充值页面", "TW交易页面"]
        : project === "Dana"
          ? ["Dana充值页面", "Dana交易页面"]
          : ["Dana充值页面", "Dana交易页面", "TW充值页面", "TW交易页面"];
      const list = [...projectPages, ...TASK_APP_JUMP_COMMON];
      if (selected && !list.includes(selected)) list.unshift(selected);
      return list;
    }

    function applyDefaultAppJump(d) {
      if (!d || !d.app || (d.type !== "充值" && d.type !== "实盘交易")) return d;
      if (d.jumpType && d.jumpType !== "APP内部跳转") return d;
      const def = defaultAppJumpForTask(d.type, d.app);
      if (!def) return d;
      d.jumpType = "APP内部跳转";
      d.jumpUrl = "";
      if (!d.appJump || isProjectDefaultAppJump(d.appJump)) d.appJump = def;
      return d;
    }

    function taskDraftFromTask(task = {}) {
      const jumpType = resolveTaskJumpType(task);
      const jumpValue = task.jumpUrl || task.appJump || "";
      return {
        id: task.id || "",
        name: task.name || "",
        type: task.type || "无任务",
        app: task.app || "Dana",
        enabled: task.enabled !== false,
        status: task.status || "启用",
        couponsText: (task.coupons || []).join(","),
        rechargeAmount: task.type === "充值" ? (String(task.condition || "").match(/>=\s*(\d+)/)?.[1] || "50") : "50",
        tradeLots: task.type === "实盘交易" ? (String(task.condition || "").match(/>=\s*(\d+)/)?.[1] || "2") : "2",
        financeDays: task.type === "理财" ? (String(task.condition || "").match(/时长(\d+)天/)?.[1] || "30") : "30",
        financeRate: task.type === "理财" ? (String(task.condition || "").match(/收益(\d+(?:\.\d+)?)%/)?.[1] || "2") : "2",
        financeDeposit: task.type === "理财" ? (String(task.condition || "").match(/金额(\d+)/)?.[1] || "1000") : "1000",
        taskValidType: normalizeTaskValidType(task.taskValidType) || (task.type === "无任务" ? "" : "领取后"),
        taskValidDays: task.taskValidDays || (task.type === "无任务" ? "" : "7"),
        jumpType,
        appJump: jumpType === "APP内部跳转" ? (task.appJump || "") : "",
        jumpUrl: jumpType === "URL链接" ? jumpValue : (task.jumpUrl || ""),
        couponRatios: { ...(task.couponRatios || {}) },
        langConfigs: JSON.parse(JSON.stringify(task.langConfigs || {}))
      };
    }

    function openReadonlyTaskCouponConfig(taskId, couponId) {
      const task = state.data.tasks.find(x => x.id === taskId) || state.data.tasks.find(x => (x.coupons || []).includes(couponId)) || state.data.tasks[0];
      state.selectedTaskId = task?.id || taskId || "";
      state.taskModal.draft = normalizeTaskDraft(taskDraftFromTask(task));
      state.taskLang.selectedLanguage = "英文";
      openTaskCouponConfigStacked(couponId, true);
    }

    const MAX_TASK_COUPONS = 10;
    const MAX_CAMPAIGN_TASKS = 5;

    function taskCouponIdsFromText(text = "") {
      return text.split(",").map(x => x.trim()).filter(Boolean);
    }

    function couponSupportsRatio(couponOrType) {
      const type = typeof couponOrType === "string" ? couponOrType : (couponOrType?.type || "");
      return ["手续费抵扣红包","盈亏抵扣红包"].includes(type);
    }

    function couponRatioText(coupon) {
      if (!couponSupportsRatio(coupon)) return "--";
      const ratio = coupon?.ratio;
      if (ratio === undefined || ratio === null || String(ratio).trim() === "") return "--";
      return `${String(ratio).trim().replace(/%$/, "")}%`;
    }

    function setTaskCouponQuantity(couponId, nextCount) {
      const d = state.taskModal.draft || {};
      const keep = taskCouponIdsFromText(d.couponsText).filter(id => id !== couponId);
      const maxAdd = Math.max(0, MAX_TASK_COUPONS - keep.length);
      const safeCount = Math.min(Math.max(0, nextCount), maxAdd);
      const add = Array.from({ length: safeCount }, () => couponId);
      d.couponsText = [...keep, ...add].join(",");
      if (safeCount <= 0 && d.langConfigs) delete d.langConfigs[couponId];
      state.taskModal.draft = d;
      return safeCount;
    }

    function saveStackedTaskCouponConfig() {
      const descInput = document.getElementById("taskCouponDescInput");
      if (!descInput) return true;
      const desc = descInput.value.trim();
      if (!desc) {
        notify("error", "红包描述必填");
        return false;
      }
      const titleInput = document.getElementById("taskCouponTitleInput");
      const coupon = state.data.coupons.find(c => c.id === state.taskModal.selectedCouponId);
      const title = (titleInput ? titleInput.value.trim() : "") || resolveCouponTitleTemplate(coupon, state.taskLang.selectedLanguage);
      if (titleInput && !titleInput.value.trim()) {
        notify("error", "红包标题必填");
        return false;
      }
      const config = ensureTaskCouponConfig(state.taskModal.selectedCouponId);
      config[state.taskLang.selectedLanguage] = { title, desc };
      return true;
    }

    function renderStackedTaskCouponConfig(host, readonly = false) {
      ensureTaskLangTemplates();
      const L = state.taskLang;
      const couponId = state.taskModal.selectedCouponId;
      const coupon = state.data.coupons.find(c => c.id === couponId);
      const config = ensureTaskCouponConfig(couponId);
      const current = config[L.selectedLanguage] || { title: "", desc: "" };
      const titleValue = current.title || (couponId === "FINANCE" ? "理财任务" : resolveCouponTitleTemplate(coupon, L.selectedLanguage));
      host.querySelector(".stacked-modal-body").innerHTML = `<div class="grid grid-cols-[340px_1fr] gap-8 text-[14px]">
        <div>
          <div class="font-semibold mb-3">1 选择语言</div>
          <div class="space-y-3">${L.languages.map(lang => `<button data-stacked-task-lang-item="${lang}" class="w-full h-14 px-4 rounded border text-left flex items-center justify-between font-semibold ${L.selectedLanguage===lang ? "border-primary bg-[#f0f6ff]" : "border-line bg-white"}"><span>${lang}</span><span class="text-[#16a34a] text-[12px]">已配置</span></button>`).join("")}</div>
        </div>
        <div>
          <div class="flex items-center justify-between mb-5">
            <div class="font-semibold">2 ${readonly ? "查看" : "配置"}红包多语言</div>
            ${readonly ? "" : `<button id="btnResetTaskCouponConfig" class="${btnClass(false,true)}">同步</button>`}
          </div>
          <div class="mb-4 text-[#64748b]">${couponId === "FINANCE" ? "当前任务：理财任务" : `当前红包：${couponId || "--"} ${couponTitle(coupon)}`}</div>
          <label class="form-label ${readonly ? "" : "required"} mb-1">红包标题</label>
          ${readonly
            ? `<div class="w-full border border-line rounded px-3 py-2 mb-4 bg-gray-50 text-[#475569]">${titleValue}</div>`
            : `<input id="taskCouponTitleInput" class="w-full border border-line rounded px-3 py-2 mb-4" placeholder="请输入红包标题" value="${String(titleValue || "").replace(/"/g, "&quot;")}">`}
          <label class="form-label required mb-1">红包描述</label>
          <textarea id="taskCouponDescInput" class="w-full min-h-[108px] border border-line rounded px-3 py-2 ${readonly ? "bg-gray-50 text-[#475569]" : ""}" placeholder="You must first complete the 3-way trade." ${readonly ? "disabled" : ""}>${current.desc || ""}</textarea>
        </div>
      </div>`;
      const stackedFooter = host.querySelector(".stacked-modal-footer");
      const stackedFooterHtml = normalizeModalFooter(readonly
        ? `<button class="${btnClass(false,true)}" data-close-stacked-modal>关闭</button>`
        : `<button class="${btnClass(false,true)}" data-close-stacked-modal>取消</button><button id="btnSaveTaskCouponConfig" class="${btnClass(true,true)}">保存</button>`);
      stackedFooter.innerHTML = stackedFooterHtml;
      stackedFooter.classList.toggle("hidden", !stackedFooterHtml);
      host.querySelectorAll("[data-close-stacked-modal]").forEach(btn => btn.onclick = () => closeStackedModal(host));
      host.querySelectorAll("[data-stacked-task-lang-item]").forEach(btn => {
        btn.onclick = () => {
          if (!readonly && !saveStackedTaskCouponConfig()) return;
          state.taskLang.selectedLanguage = btn.dataset.stackedTaskLangItem;
          renderStackedTaskCouponConfig(host, readonly);
        };
      });
      const reset = host.querySelector("#btnResetTaskCouponConfig");
      if (reset) reset.onclick = () => {
        if (!saveStackedTaskCouponConfig()) return;
        openTaskCouponConfigSync(host);
      };
      const save = host.querySelector("#btnSaveTaskCouponConfig");
      if (save) save.onclick = () => {
        if (!saveStackedTaskCouponConfig()) return;
        notify("success", "当前红包配置保存成功");
        closeStackedModal(host);
      };
    }

    function openTaskCouponConfigSync(host) {
      const couponId = state.taskModal.selectedCouponId;
      const config = ensureTaskCouponConfig(couponId);
      const currentLang = state.taskLang.selectedLanguage;
      const source = config[currentLang] || { title: "", desc: "" };
      const syncHost = openStackedModal({
        title: "选择要同步的语言",
        body: `<div class="space-y-4 text-[14px]">
          <label class="flex items-center gap-2 font-medium"><input id="syncAllTaskCouponLangs" type="checkbox">全选其他语言</label>
          <div class="grid grid-cols-3 gap-3">${state.taskLang.languages.map(lang => `<label class="flex items-center gap-2 min-h-[32px] ${lang===currentLang ? "text-[#94a3b8]" : ""}"><input type="checkbox" data-sync-task-coupon-lang="${lang}" ${lang===currentLang ? "checked disabled" : ""}>${lang}${lang===currentLang ? "（当前）" : ""}</label>`).join("")}</div>
        </div>`,
        footer: `<button class="${btnClass(false,true)}" data-close-stacked-modal>取消</button><button id="confirmTaskCouponSyncLang" class="${btnClass(true,true)}">保存</button>`
      });
      syncHost.querySelectorAll("[data-close-stacked-modal]").forEach(btn => {
        btn.onclick = () => closeStackedModal(syncHost);
      });
      const syncAll = syncHost.querySelector("#syncAllTaskCouponLangs");
      if (syncAll) {
        syncAll.onchange = () => {
          syncHost.querySelectorAll("[data-sync-task-coupon-lang]").forEach(chk => {
            if (chk.disabled) return;
            chk.checked = syncAll.checked;
          });
        };
      }
      const confirm = syncHost.querySelector("#confirmTaskCouponSyncLang");
      if (confirm) confirm.onclick = () => {
        const targets = [...syncHost.querySelectorAll("[data-sync-task-coupon-lang]")]
          .filter(chk => chk.checked && !chk.disabled)
          .map(chk => chk.dataset.syncTaskCouponLang);
        if (!targets.length) return notify("error", "请选择要同步的语言");
        targets.forEach(lang => {
          config[lang] = { title: source.title || "", desc: source.desc || "" };
        });
        closeStackedModal(syncHost);
        notify("success", "红包多语言文案同步成功");
        if (host) renderStackedTaskCouponConfig(host, false);
      };
    }

    function openTaskCouponConfigStacked(couponId, readonly = false) {
      state.taskModal.selectedCouponId = couponId;
      ensureTaskCouponConfig(couponId);
      const host = openStackedModal({ title: readonly ? "查看红包多语言" : "配置红包多语言", body: "", footer: "" });
      renderStackedTaskCouponConfig(host, readonly);
    }

    function taskTypeOptionsForProject(project) {
      if (!project) return [];
      const base = ["无任务","充值","实盘交易"];
      // [临时隐藏] 理财任务创建入口：Dana 下原本追加「理财」，现按开关控制是否展示
      const withFinance = project === "Dana" ? [...base, "理财"] : base;
      return visibleTaskTypeOptions(withFinance);
    }

    function filterTaskCouponsByProject(couponsText, project) {
      if (!project) return "";
      return taskCouponIdsFromText(couponsText)
        .filter(id => {
          const c = state.data.coupons.find(item => item.id === id);
          return c && c.project === project;
        })
        .join(",");
    }

    function normalizeTaskDraft(d) {
      if (d.app && !["Dana", "TW"].includes(d.app)) d.app = "";
      const options = taskTypeOptionsForProject(d.app);
      if (!d.app) {
        d.type = "";
        d.couponsText = "";
        d.taskValidType = "";
        d.taskValidDays = "";
        d.jumpType = "APP内部跳转";
        d.appJump = "";
        d.jumpUrl = "";
        if (!d.couponRatios) d.couponRatios = {};
        if (!d.jumpUrl) d.jumpUrl = "";
        if (!d.appJump) d.appJump = "";
        return d;
      }
      if (!options.includes(d.type)) d.type = "无任务";
      d.couponsText = filterTaskCouponsByProject(d.couponsText || "", d.app);
      if (d.type !== "无任务" && !d.taskValidType) d.taskValidType = "领取后";
      if (d.type !== "无任务" && !d.taskValidDays) d.taskValidDays = "7";
      d.taskValidType = normalizeTaskValidType(d.taskValidType);
      if (!d.jumpType || !["APP内部跳转", "URL链接"].includes(d.jumpType)) {
        d.jumpType = resolveTaskJumpType(d);
      }
      if (d.type === "无任务") {
        d.taskValidType = "";
        d.taskValidDays = "";
        d.jumpType = "APP内部跳转";
        d.appJump = "";
        d.jumpUrl = "";
      }
      if (d.type === "理财") {
        d.couponsText = "";
        d.couponRatios = {};
      }
      if (d.type !== "无任务" && d.type !== "理财") {
        const firstCouponId = taskCouponIdsFromText(d.couponsText || "")[0] || "";
        d.couponsText = firstCouponId;
      }
      if (!d.couponRatios) d.couponRatios = {};
      if (!d.jumpUrl) d.jumpUrl = "";
      if (!d.appJump) d.appJump = "";
      applyDefaultAppJump(d);
      return d;
    }

    function openTaskModal(mode = "create", sourceId = "") {
      const source = state.data.tasks.find(t => t.id === sourceId);
      // [临时隐藏] 理财任务创建/编辑入口关闭时拦截
      if (!SHOW_FINANCE_TASK && source && isFinanceTaskType(source.type)) {
        return notify("warn", "理财任务入口已临时隐藏");
      }
      const draft = source ? taskDraftFromTask(source) : {
        id: "",
        name: "",
        type: "",
        app: "",
        enabled: true,
        status: "启用",
        couponsText: "",
        rechargeAmount: "",
        tradeLots: "",
        financeDays: "",
        financeRate: "",
        financeDeposit: "",
        taskValidType: "",
        taskValidDays: "",
        jumpType: "APP内部跳转",
        appJump: "",
        jumpUrl: "",
        couponRatios: {},
        langConfigs: {}
      };
      state.taskModal = { mode, sourceId, draft: normalizeTaskDraft(draft) };
      switchPage("task-create-modal");
    }

    function saveCurrentTaskDraft() {
      const d = state.taskModal.draft || {};
      const ids = ["taskName","taskType","taskProject","taskRechargeAmount","taskTradeLots","taskFinanceDays","taskFinanceRate","taskFinanceDeposit","taskValidType","taskValidDays","taskJumpType","taskAppJump","taskJumpUrl"];
      ids.forEach(id => {
        const node = document.getElementById(id);
        if (!node) return;
        const key = {
          taskName: "name",
          taskType: "type",
          taskProject: "app",
          taskRechargeAmount: "rechargeAmount",
          taskTradeLots: "tradeLots",
          taskFinanceDays: "financeDays",
          taskFinanceRate: "financeRate",
          taskFinanceDeposit: "financeDeposit",
          taskValidType: "taskValidType",
          taskValidDays: "taskValidDays",
          taskJumpType: "jumpType",
          taskAppJump: "appJump",
          taskJumpUrl: "jumpUrl"
        }[id];
        d[key] = node.value.trim();
      });
      if (!d.couponRatios) d.couponRatios = {};
      state.taskModal.draft = d;
    }

    /** 任务配置（条件 + 跳转）是否已填完整；未完整时「查看配置」置灰 */
    function isTaskConditionComplete(d) {
      if (!d || !d.type || d.type === "无任务") return true;
      if (d.type === "充值" && (!d.rechargeAmount || Number(d.rechargeAmount) <= 0)) return false;
      if (d.type === "实盘交易" && (!d.tradeLots || Number(d.tradeLots) <= 0)) return false;
      if (d.type === "理财" && (!d.financeDays || !d.financeRate || !d.financeDeposit)) return false;
      if (!d.jumpType) return false;
      if (d.jumpType === "APP内部跳转" && !d.appJump) return false;
      if (d.jumpType === "URL链接") {
        if (!d.jumpUrl) return false;
        if (!isJumpUrlValue(d.jumpUrl)) return false;
      }
      return true;
    }

    function refreshTaskConfigButtons() {
      saveCurrentTaskDraft();
      const d = state.taskModal.draft || {};
      const canView = isTaskConditionComplete(d);
      const cls = btnClass(true, canView);
      document.querySelectorAll("[data-task-coupon-config]").forEach(btn => {
        btn.className = cls;
      });
      const btnFinanceLangConfig = document.getElementById("btnFinanceLangConfig");
      if (btnFinanceLangConfig) btnFinanceLangConfig.className = cls;
    }

    function validateTaskDraft(d) {
      if (!d.name) return "任务名称必填";
      if (!d.app) return "项目必填";
      if (!d.type) return "任务类型必填";
      if (d.app !== "Dana" && d.type === "理财") return "只有项目 Dana 支持理财任务";
      if (d.type === "充值" && (!d.rechargeAmount || Number(d.rechargeAmount) <= 0)) return "充值金额必须大于 0";
      if (d.type === "实盘交易" && (!d.tradeLots || Number(d.tradeLots) <= 0)) return "实盘手数必须大于 0";
      if (d.type === "理财" && (!d.financeDays || !d.financeRate || !d.financeDeposit)) return "理财任务需填写理财时长、年化收益、最低存款金额";
      if (d.type !== "无任务") {
        if (!d.taskValidType) return "请选择任务有效期类型";
        const taskValidDaysNum = Number(d.taskValidDays);
        if (!Number.isInteger(taskValidDaysNum) || taskValidDaysNum <= 0) return "任务有效期天数必须填写正整数";
        if (!d.jumpType) return "请选择跳转方式";
        if (d.jumpType === "APP内部跳转" && !d.appJump) return "请选择APP跳转页面";
        if (d.jumpType === "URL链接") {
          if (!d.jumpUrl) return "请填写URL链接";
          if (!isJumpUrlValue(d.jumpUrl)) return "URL链接需以 http:// 或 https:// 开头";
        }
      }
      if (d.type !== "理财" && !d.couponsText.trim()) return "请至少关联一个红包模板";
      const couponIds = taskCouponIdsFromText(d.couponsText);
      if (d.type !== "无任务" && d.type !== "理财" && couponIds.length > 1) return "充值/实盘交易任务一次只能关联一个红包模板";
      if (d.type !== "理财" && couponIds.length > MAX_TASK_COUPONS) return `单个任务最多添加${MAX_TASK_COUPONS}个红包模板（按数量累计）`;
      for (const id of couponIds) {
        const coupon = state.data.coupons.find(c => c.id === id);
        if (!coupon) return `红包模板 ${id} 不存在`;
        if (coupon.project !== d.app) return `只能关联当前项目（${d.app}）下的红包模板`;
      }
      return "";
    }

    function ensureTaskLangTemplates() {
      const L = state.taskLang;
      if (!Array.isArray(L.titleTypes)) L.titleTypes = ["现金红包","手续费抵扣红包","盈亏抵扣红包","提现免佣券"];
      L.descTypes = ["无任务","充值任务","实盘交易"];
      L.types = L.descTypes;
      if (!L.selectedTitleType) L.selectedTitleType = "现金红包";
      if (!L.tab) L.tab = "title";
      if (!L.descTypes.includes(L.selectedType)) L.selectedType = "无任务";
      if (!L.titleTemplates) L.titleTemplates = {};
      if (!L.templates) L.templates = {};
      L.languages.forEach((lang) => {
        if (!L.templates[lang]) L.templates[lang] = {};
        if (!L.titleTemplates[lang]) L.titleTemplates[lang] = {};
        L.descTypes.forEach((type) => {
          if (typeof L.templates[lang][type] !== "string") L.templates[lang][type] = "";
        });
        L.titleTypes.forEach((type) => {
          if (typeof L.titleTemplates[lang][type] !== "string") {
            L.titleTemplates[lang][type] = lang === "英文" ? defaultCouponTitleTemplate(type) : "";
          }
        });
      });
    }

    function isCouponTitleTypeConfigured(type, lang = state.taskLang.selectedLanguage) {
      ensureTaskLangTemplates();
      return Boolean(state.taskLang.titleTemplates[lang]?.[type]?.trim());
    }

    function isCouponTitleLanguageConfigured(lang) {
      ensureTaskLangTemplates();
      return state.taskLang.titleTypes.every(type => isCouponTitleTypeConfigured(type, lang));
    }

    function isTaskTypeConfigured(type, lang = state.taskLang.selectedLanguage) {
      ensureTaskLangTemplates();
      return Boolean(state.taskLang.templates[lang]?.[type]?.trim());
    }

    function isTaskLanguageConfigured(lang) {
      ensureTaskLangTemplates();
      return state.taskLang.descTypes.every(type => isTaskTypeConfigured(type, lang));
    }

    function isMultiLangLanguageConfigured(lang) {
      return state.taskLang.tab === "title"
        ? isCouponTitleLanguageConfigured(lang)
        : isTaskLanguageConfigured(lang);
    }

    function refreshTaskLangStatusUI() {
      ensureTaskLangTemplates();
      document.querySelectorAll("[data-task-lang-type]").forEach(btn => {
        const type = btn.dataset.taskLangType;
        const icon = btn.querySelector("span:first-child");
        const configured = state.taskLang.tab === "title"
          ? isCouponTitleTypeConfigured(type)
          : isTaskTypeConfigured(type);
        if (!icon) return;
        icon.className = configured
          ? "inline-flex items-center justify-center w-4 h-4 rounded-full bg-[#22c55e] text-white text-[10px]"
          : "inline-flex items-center justify-center w-4 h-4 rounded-full border border-[#cbd5e1] text-transparent";
        icon.textContent = configured ? "✓" : "";
      });
      document.querySelectorAll("[data-task-lang-item]").forEach(btn => {
        const lang = btn.dataset.taskLangItem;
        const status = btn.querySelector("span:last-child");
        const configured = isMultiLangLanguageConfigured(lang);
        if (!status) return;
        status.className = `text-[11px] ${configured ? "text-[#16a34a]" : "text-[#94a3b8]"}`;
        status.textContent = configured ? "已配置" : "未配置";
      });
    }

    function saveCurrentTaskLangInput() {
      const input = document.getElementById("taskLangInput");
      if (!input) return;
      ensureTaskLangTemplates();
      const L = state.taskLang;
      if (L.tab === "title") {
        L.titleTemplates[L.selectedLanguage][L.selectedTitleType] = input.value;
      } else {
        L.templates[L.selectedLanguage][L.selectedType] = input.value;
      }
    }

    const TASK_LANG_TITLE_VARS = [
      { key: "amount", label: "金额", desc: "红包金额参数，实际展示时自动替换为对应红包金额" },
      { key: "ratio", label: "抵扣比例", desc: "抵扣比例参数，实际展示时自动替换为红包抵扣比例（如 30%）", ratioOnly: true }
    ];
    const TASK_LANG_DESC_VARS = [
      { key: "number", label: "手数", desc: "实盘交易任务参数，发送时替换为实际手数", types: ["实盘交易"] },
      { key: "count", label: "充值金额", desc: "充值金额任务参数，发送时替换为实际充值金额", types: ["充值任务"] },
      { key: "ratio", label: "抵扣比例", desc: "抵扣比例参数，发送时替换为红包抵扣比例", types: [] },
      { key: "days", label: "理财时长", desc: "理财时长参数，发送时替换为理财天数", types: [] },
      { key: "rate", label: "年化收益", desc: "理财年化收益参数，发送时替换为年化收益率", types: [] },
      { key: "deposit", label: "最低存款", desc: "最低存款金额参数，发送时替换为最低存款金额", types: [] }
    ];
    function taskLangVarToken(key) {
      return `{${String(key || "").replace(/^\{|\}$/g, "")}}`;
    }
    function taskLangVarTooltip(item) {
      return `${item.label}（${taskLangVarToken(item.key)}）：${item.desc}`;
    }
    function taskLangTitleVarsForType(type) {
      return TASK_LANG_TITLE_VARS.filter(item => !item.ratioOnly || couponSupportsRatio(type));
    }
    function taskLangDescVarsForType(type) {
      return TASK_LANG_DESC_VARS.filter(item => (item.types || []).includes(type));
    }
    function renderTaskLangVarChips(isTitleTab, selectedType = "") {
      const vars = isTitleTab ? taskLangTitleVarsForType(selectedType) : taskLangDescVarsForType(selectedType);
      if (!vars.length) return "";
      return `<div class="lang-var-chips">${vars.map(item =>
        `<button type="button" class="lang-var-chip" data-insert-lang-var="${item.key}" title="${taskLangVarTooltip(item).replace(/"/g, "&quot;")}">${item.label}</button>`
      ).join("")}</div>`;
    }
    function insertTaskLangVar(key) {
      const input = document.getElementById("taskLangInput");
      if (!input) return;
      const token = taskLangVarToken(key);
      if (!token || token === "{}") return;
      input.focus();
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? start;
      input.value = `${input.value.slice(0, start)}${token}${input.value.slice(end)}`;
      input.selectionStart = input.selectionEnd = start + token.length;
      input.dispatchEvent(new Event("input", { bubbles: true }));
    }

    function pushTaskLog(row, content, operator = "Jenny") {
      if (!row) return;
      if (!Array.isArray(row.logs)) row.logs = [];
      row.logs.unshift({ operator, time: nowStamp(), content });
    }

    function formatAmount(v) {
      const n = Number(v);
      if (!Number.isFinite(n)) return "";
      return `$${Number.isInteger(n) ? n : n.toFixed(2)}`;
    }

    function generatedCouponName(type, amount, ratio) {
      const displayAmount = typeof amount === "number" ? formatAmount(amount) : formatAmount(parseMoney(amount));
      if (!type || !displayAmount) return "";
      // 红包模板标题默认取多语言「英文」标题规则
      return fillCouponTitleTemplate(couponTitleTemplate(type, "英文"), displayAmount, ratio).trim();
    }

    function couponTitle(coupon) {
      if (!coupon) return "--";
      return generatedCouponName(coupon.type, coupon.amount, coupon.ratio) || "--";
    }

    function findCouponByKeyword(keyword, project = "") {
      const text = String(keyword || "").trim();
      if (!text) return null;
      const list = state.data.coupons.filter(c => !project || c.project === project);
      return list.find(c => c.id === text)
        || list.find(c => couponTitle(c) === text || c.name === text)
        || list.find(c => c.id.includes(text) || couponTitle(c).includes(text) || String(c.name || "").includes(text))
        || null;
    }

    function searchCouponsByKeyword(keyword, project = "") {
      const text = String(keyword || "").trim();
      if (!text || !project) return [];
      return state.data.coupons
        .filter(c => c.enabled)
        .filter(c => c.project === project)
        .filter(c => c.id.includes(text) || couponTitle(c).includes(text) || String(c.name || "").includes(text))
        .slice(0, 8);
    }

    function findTaskByKeyword(keyword, project = "") {
      const text = String(keyword || "").trim();
      if (!text) return null;
      const enabled = state.data.tasks
        .filter(t => t.enabled !== false)
        .filter(t => !project || t.app === project)
        // [临时隐藏] 活动发放选任务时不暴露理财任务
        .filter(t => isVisibleTaskRow(t));
      return enabled.find(t => t.id === text)
        || enabled.find(t => t.name === text)
        || enabled.find(t => t.id.includes(text) || String(t.name || "").includes(text))
        || null;
    }

    function searchTasksByKeyword(keyword, project = "") {
      const text = String(keyword || "").trim();
      if (!text || !project) return [];
      return state.data.tasks
        .filter(t => t.enabled !== false)
        .filter(t => t.app === project)
        // [临时隐藏] 活动发放选任务时不暴露理财任务
        .filter(t => isVisibleTaskRow(t))
        .filter(t => t.id.includes(text) || String(t.name || "").includes(text))
        .slice(0, 8);
    }

    function syncCampaignTasksByProject(project) {
      const draft = state.campaignDraft;
      if (!project) {
        draft.taskItems = [];
        draft.taskKeyword = "";
        return;
      }
      draft.taskItems = (draft.taskItems || []).filter(item => {
        if (item.custom) return true;
        const task = state.data.tasks.find(t => t.id === campaignItemTaskId(item));
        // [临时隐藏] 同步项目时一并清掉理财任务
        if (!task || task.app !== project) return false;
        return isVisibleTaskRow(task);
      });
    }

    function couponTitleFromRecord(record) {
      if (!record || record.coupon === "--") return "--";
      return generatedCouponName(record.couponType, record.amount, record.ratio) || record.coupon || "--";
    }

    function auditCouponTitle(record) {
      if (!record) return "--";
      const type = record.couponType || "";
      const amount = record.singleAmount || record.amount;
      // 标题规则：取多语言英文标题模板（{amount}/{ratio}）
      return generatedCouponName(type, amount, record.ratio) || "--";
    }

    function nextCouponId(project) {
      const prefix = project === "TW" ? "2" : "1";
      const ids = state.data.coupons
        .map(c => String(c.id))
        .filter(id => id.startsWith(prefix))
        .map(id => Number(id))
        .filter(Number.isFinite);
      if (!ids.length) return project === "TW" ? "2001" : "1001";
      return String(Math.max(...ids) + 1);
    }

    function openCouponCreateModal(mode = "create", sourceId = "", projectPrefill = "") {
      const source = state.data.coupons.find(c => c.id === sourceId);
      const baseDraft = source ? {
        project: source.project,
        name: generatedCouponName(source.type, source.amount, source.ratio),
        type: source.type,
        amount: String(parseMoney(source.amount)),
        ratio: couponSupportsRatio(source) ? String(source.ratio ?? "100") : "",
        validDays: source.validDays || "7"
      } : {
        project: projectPrefill || "",
        name: "",
        type: "",
        amount: "",
        ratio: "",
        validDays: "7"
      };
      state.couponModal = { mode, sourceId, draft: baseDraft };
      switchPage("coupon-create-modal");
    }

    function validateCampaignDraft(draft) {
      if (!draft.name) return "活动名称必填";
      if (!draft.project) return "项目必填";
      if (draft.audienceType === "添加" && !(draft.sidList || []).length) return "请至少添加一个有效SID";
      if (draft.audienceType === "TagVerse" && !draft.tagVerseName && !(draft.sidList || []).length) return "请选择TagVerse人群包";
      if (draft.audienceType === "导入" && !(draft.sidList || []).length) return "请先导入有效名单";
      if (!draft.taskItems.length) return "请至少添加一个任务或自定义红包";
      if (draft.taskItems.length > MAX_CAMPAIGN_TASKS) return `单个活动最多添加${MAX_CAMPAIGN_TASKS}个任务（含自定义红包任务）`;
      if ((draft.taskItems || []).filter(item => item.custom).length > 1) return "自定义任务一次只能添加一个";
      for (const item of draft.taskItems || []) {
        if (item.custom) continue;
        const task = state.data.tasks.find(t => t.id === campaignItemTaskId(item));
        if (!task) return `任务 ${campaignItemTaskId(item) || "--"} 不存在`;
        if (task.app !== draft.project) return `任务 ${task.id} 不属于当前项目（${draft.project}）`;
      }
      if (draft.taskItems.some(item => item.custom && !campaignCustomAmounts(item).some(a => String(a || "").trim()))) return "自定义红包金额必填";
      if (draft.deliverType === "定时发放" && !draft.deliverAt) return "请填写定时发放时间";
      if (draft.deliverType === "循环发放" && draft.loopFreq !== "每日" && !draft.loopPoint) return "循环发放需选择每周几/每月几号";
      if (draft.deliverType === "循环发放" && !draft.loopTime) return "循环发放需填写发送时间";
      if (draft.notifyEnabled && !draft.notifyTemplate) return "请选择推送模板";
      if (draft.notifyEnabled && draft.notifyType === "定时通知" && !draft.notifyAt) return "定时通知需填写通知时间";
      if (draft.reminderEnabled && !String(draft.reminderDays || "").trim()) return "临期提醒需填写临期天数";
      if (draft.reminderEnabled && !draft.reminderTime) return "临期提醒需填写提醒时间";
      if (draft.reminderEnabled && !draft.reminderTemplate) return "临期提醒需选择推送模板";
      if (state.data.campaigns.some(c => c.name === draft.name)) return "活动名称不能重复";
      if (draft.activityType === "特批活动" && state.role !== "super") return "特批活动仅超级运营可提交";
      if (draft.activityType === "特批活动" && !draft.approvalReason) return "特批活动需填写申请原因";
      return "";
    }

    function isCampaignDraftDirty(draft = state.campaignDraft) {
      const d = draft || {};
      if ((d.name || "").trim()) return true;
      if ((d.project || "").trim()) return true;
      if ((d.activityType || "普通活动") !== "普通活动") return true;
      if ((d.approvalReason || "").trim()) return true;
      if ((d.audienceType || "添加") !== "添加") return true;
      if ((d.sidInput || "").trim()) return true;
      if ((d.sidList || []).length) return true;
      if ((d.tagVerseName || "").trim()) return true;
      if ((d.importedFileName || "").trim()) return true;
      if ((d.importFailures || []).length) return true;
      if ((d.taskKeyword || "").trim()) return true;
      if ((d.taskItems || []).length) return true;
      if ((d.deliverType || "立即发放") !== "立即发放") return true;
      if ((d.deliverAt || "").trim()) return true;
      if (d.notifyEnabled || d.reminderEnabled) return true;
      if ((d.notifyTemplate || "").trim() || (d.reminderTemplate || "").trim()) return true;
      return false;
    }

    function confirmLeaveCampaignForm(syncDraft) {

    function campaignIncludesFinanceTask(row) {
      return campaignTaskIds(row).some(id => {
        const task = state.data.tasks.find(t => t.id === id);
        return task && isFinanceTaskType(task.type);
      });
    }

    function renderCampaignRecord() {
      const f = state.filters.campaign;
      const statusOptions = ["待审核","待执行","执行中","完成","已撤销","审核拒绝"];
      const activityQ = String(f.id || "").trim();
      const taskQ = String(f.taskId || "").trim();
      let rows = state.data.campaigns.filter(r => {
        const taskIds = campaignTaskIds(r);
        // [临时隐藏] 关联了理财任务的活动不展示
        if (!SHOW_FINANCE_TASK && campaignIncludesFinanceTask(r)) return false;
        return (!activityQ || String(r.id || "").includes(activityQ)) &&
          (!taskQ || taskIds.some(id => String(id || "").includes(taskQ))) &&
          (!f.activityName || r.name.includes(f.activityName)) &&
          (!f.taskName || campaignTaskNames(r).includes(f.taskName)) &&
          (!f.project || r.project === f.project) &&
          (!(f.statuses || []).length || (f.statuses || []).some(s => campaignStatuses(r).includes(s))) &&
          (!f.start || comparableDateTime(r.createdAt) >= f.start) &&
          (!f.end || comparableDateTime(r.createdAt) <= `${f.end} 23:59`);
      });
      if (state.forceEmpty) rows = [];
      el.query.innerHTML = `

              <input id="qCampaignStart" placeholder="创建开始日期" value="${f.start}">

              <button id="btnCampaignSearch" class="${btnClass(true,true)}">查询</button>
            </div>
          </div>
        </div>
      `;
      el.action.innerHTML = `<div class="flex items-center gap-2"><button id="btnCampaignCreate" class="coupon-tool-btn">活动发放</button></div>`;
      el.table.innerHTML = !rows.length ? `<div class="border border-dashed border-line rounded p-12 text-center text-sm text-muted">暂无活动记录</div>` : `
        <div class="coupon-table-wrap overflow-auto">

            ${tableColgroup([6, 7, 14, 10, 11, 9, 11, 11, 21])}

            <tbody>
              ${rows.map(r => {

          if (f.start && t < f.start) return false;
          if (f.end && t > `${f.end} 23:59`) return false;
        }
        return true;

      const f = state.filters.audit;

      const pendingAuditCounts = AUDIT_TABS.reduce((acc, tab) => {
        acc[tab.key] = state.data.audits.filter(row => auditTabOf(row) === tab.key && isAuditPending(row.status)).length;
        return acc;
      }, {});

      let rows = [];
      if (isReceive) {
        rows = buildReceiveAuditRows().filter(r => {
          if (f.project && r.project !== f.project) return false;
          if (f.couponId && !String(r.couponId || "").includes(f.couponId)) return false;
          if (f.couponType && r.couponType !== f.couponType) return false;
          if (f.status && !String(r.auditStatus || "").includes(f.status)) return false;
          if (f.sid && !String(r.sid || "").includes(f.sid)) return false;
          if (f.object && !String(r.batch || "").includes(f.object)) return false;
          if (f.start && comparableDateTime(r.applyTime) < f.start) return false;
          if (f.end && comparableDateTime(r.applyTime) > `${f.end} 23:59`) return false;
          if (f.reviewStart && (!(r.reviewTime && r.reviewTime !== "--") || comparableDateTime(r.reviewTime) < f.reviewStart)) return false;
          if (f.reviewEnd && (!(r.reviewTime && r.reviewTime !== "--") || comparableDateTime(r.reviewTime) > `${f.reviewEnd} 23:59`)) return false;
          return true;
        });
      } else if (isUsage) {
        rows = buildUsageAuditRows().filter(r => {
          if (f.project && r.project !== f.project) return false;
          if (f.couponId && !String(r.couponId || "").includes(f.couponId)) return false;
          if (f.status && !String(r.auditStatus || "").includes(f.status)) return false;
          if (f.sid && !String(r.sid || "").includes(f.sid)) return false;
          if (f.depositOrder && !String(r.depositOrder || "").includes(f.depositOrder)) return false;
          if (f.couponType && r.couponType !== f.couponType) return false;
          if (f.region && r.region !== f.region) return false;
          if (f.auditMethod && r.auditMethod !== f.auditMethod) return false;
          if (f.reviewStart && (!(r.reviewTime && r.reviewTime !== "--") || comparableDateTime(r.reviewTime) < f.reviewStart)) return false;
          if (f.reviewEnd && (!(r.reviewTime && r.reviewTime !== "--") || comparableDateTime(r.reviewTime) > `${f.reviewEnd} 23:59`)) return false;
          return true;
        });
      } else if (isIssue) {
        rows = state.data.audits.filter(r => {
          if (auditTabOf(r) !== "issue") return false;
          if (f.project && auditProject(r) !== f.project) return false;
          if (f.couponId && !String(r.couponId || "").includes(f.couponId)) return false;
          if (f.status && !String(r.status || "").includes(f.status)) return false;
          const batchIds = auditIssueBatchIds(r);
          if (f.object) {
            const hit = batchIds.some(id => batchIdMatchesFilter(id, f.object) || String(id).includes(f.object))
              || batchIdMatchesFilter(r.batch, f.object)
              || String(r.activity || "").includes(f.object)

          if (f.end && comparableDateTime(r.apply) > `${f.end} 23:59`) return false;
          if (f.reviewStart && (!(r.reviewTime && r.reviewTime !== "--") || comparableDateTime(r.reviewTime) < f.reviewStart)) return false;
          if (f.reviewEnd && (!(r.reviewTime && r.reviewTime !== "--") || comparableDateTime(r.reviewTime) > `${f.reviewEnd} 23:59`)) return false;
          return true;
        }).map(r => {

            rid: r.rid,

        });
